[build-system]
requires = [
    "setuptools>=77.0.0",
    "wheel",
    "nanobind>=1.9.0",
    "cmake>=3.18",
    "ninja"
]
build-backend = "setuptools.build_meta"

[project]
name = "mshqc"
version = "1.0.3"
description = "Multi-State High-Quality Calculations: Modern C++20 Quantum Chemistry Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    {name = "Muhamad Syahrul Hidayat"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "h5py>=3.8.0",
    "nanobind>=1.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "sphinx>=4.0",
    "matplotlib>=3.5"
]

[project.urls]
Homepage = "https://github.com/syahrulhidayat/mshqc"
"Bug Tracker" = "https://github.com/syahrulhidayat/mshqc/issues"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["mshqc"]

[tool.setuptools.package-data]
mshqc = ["*.so", "*.pyi", "py.typed"]