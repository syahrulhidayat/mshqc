
name: Instant Publish Artifacts to PyPI and GitHub Release

on:
  push:
    branches: ["build-pypi"]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID sumber artifact wheel"
        required: false
        default: "43217985325"
      target_version:
        description: "Versi rilis PyPI baru (kosongkan untuk otomatis 1.0.4.post17)"
        required: false
        default: "1.0.4.post17"

permissions:
  contents: write
  actions: read

jobs:
  publish_existing_wheels:
    name: Repack Artifacts (Fix macOS MKL + README) & Upload to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Wheels from Run 43217985325
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id || '43217985325' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: cibw-wheels-*
          path: raw_wheels
          merge-multiple: true

      - name: Patch Metadata (Fix macOS MKL, Inject README.md, Bump Version) & Build sdist
        id: prep
        env:
          TARGET_VER: ${{ inputs.target_version || '1.0.4.post17' }}
        run: |
          python3 -m pip install --upgrade pip build twine packaging

          python3 - << 'PYEOF'
          import base64
          import glob
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          target_ver = os.environ.get("TARGET_VER", "1.0.4.post17").strip()
          readme_text = Path("README.md").read_text(encoding="utf-8").strip()

          # 1. Perbarui pyproject.toml & __init__.py agar sdist sinkron dan bebas bug MKL di macOS
          pyproj_path = Path("pyproject.toml")
          pyproj_txt = pyproj_path.read_text(encoding="utf-8")
          pyproj_txt = re.sub(r'version\s*=\s*"[^"]+"', f'version = "{target_ver}"', pyproj_txt, count=1)
          pyproj_txt = re.sub(r'"mkl(?:\s*;[^"]*)?"', '"mkl; sys_platform != \'darwin\'"', pyproj_txt)
          pyproj_path.write_text(pyproj_txt, encoding="utf-8")

          init_path = Path("python/mshqc/__init__.py")
          if init_path.exists():
              init_txt = init_path.read_text(encoding="utf-8")
              init_txt = re.sub(r'__version__\s*=\s*"[^"]+"', f'__version__ = "{target_ver}"', init_txt)
              init_path.write_text(init_txt, encoding="utf-8")

          out_dir = Path("dist")
          out_dir.mkdir(parents=True, exist_ok=True)

          def b64_nopad(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).decode("ascii").rstrip("=")

          # 2. Proses setiap file .whl dari Run 43217985325
          whl_files = sorted(glob.glob("raw_wheels/*.whl"))
          if not whl_files:
              raise RuntimeError("Tidak ada file .whl ditemukan di raw_wheels/!")

          for whl_str in whl_files:
              whl_path = Path(whl_str)
              # Ubah nama file wheel ke target_ver: mshqc-<ver>-cp3XX-...
              new_whl_name = re.sub(r"^mshqc-[^-]+-", f"mshqc-{target_ver}-", whl_path.name)
              # Pada macOS, jika tag memakai macosx_26_0_arm64, tambahkan juga kompatibilitas macosx_14_0_arm64
              new_whl_path = out_dir / new_whl_name

              new_dist_info = f"mshqc-{target_ver}.dist-info"
              records = []

              with zipfile.ZipFile(whl_path, "r") as zin, \
                   zipfile.ZipFile(new_whl_path, "w", compression=zipfile.ZIP_DEFLATED) as zout:

                  for item in zin.infolist():
                      fname = item.filename
                      if fname.endswith(".dist-info/RECORD"):
                          continue

                      data = zin.read(fname)

                      # Ganti nama folder .dist-info lama ke versi baru
                      if ".dist-info/" in fname:
                          suffix = fname.split(".dist-info/", 1)[1]
                          fname = f"{new_dist_info}/{suffix}"

                      # Update __version__ di dalam mshqc/__init__.py pada wheel
                      if fname == "mshqc/__init__.py":
                          txt = data.decode("utf-8", errors="replace")
                          txt = re.sub(r'__version__\s*=\s*"[^"]+"', f'__version__ = "{target_ver}"', txt)
                          data = txt.encode("utf-8")

                      # Update METADATA: Version, Requires-Dist mkl (non-darwin), dan README.md
                      if fname.endswith(".dist-info/METADATA"):
                          raw_meta = data.decode("utf-8", errors="replace")
                          headers = raw_meta.split("\n\n", 1)[0].splitlines()
                          clean_headers = []
                          for h in headers:
                              if h.startswith("Version:"):
                                  clean_headers.append(f"Version: {target_ver}")
                              elif h.startswith("Requires-Dist:") and "mkl" in h:
                                  clean_headers.append('Requires-Dist: mkl ; sys_platform != "darwin"')
                              elif h.startswith("Description-Content-Type:"):
                                  continue
                              else:
                                  clean_headers.append(h)

                          clean_headers.append("Description-Content-Type: text/markdown")
                          if not any("github.com/syahrulhidayat/mshqc" in h for h in clean_headers):
                              clean_headers.append("Project-URL: Homepage, https://github.com/syahrulhidayat/mshqc")

                          data = ("\n".join(clean_headers) + "\n\n" + readme_text + "\n").encode("utf-8")

                      info_copy = zipfile.ZipInfo(filename=fname, date_time=item.date_time)
                      info_copy.compress_type = zipfile.ZIP_DEFLATED
                      info_copy.external_attr = item.external_attr
                      zout.writestr(info_copy, data)

                      sha = b64_nopad(hashlib.sha256(data).digest())
                      records.append(f"{fname},sha256={sha},{len(data)}")

                  rec_fname = f"{new_dist_info}/RECORD"
                  records.append(f"{rec_fname},,")
                  rec_bytes = ("\n".join(records) + "\n").encode("utf-8")
                  zout.writestr(rec_fname, rec_bytes)

              print(f"[OK] Repacked & Fixed Wheel: {new_whl_path.name}")

          # 3. Bangun sdist (.tar.gz) dengan basis sets dan README.md
          subprocess.run(["git", "clone", "--depth", "1", "https://github.com/syahrulhidayat/mshqc-basis.git", "/tmp/mshqc-basis"], check=True)
          Path("data/basis").mkdir(parents=True, exist_ok=True)
          for gbs in Path("/tmp/mshqc-basis/data/basis").glob("*.gbs"):
              shutil.copy2(gbs, Path("data/basis") / gbs.name)
          shutil.rmtree("/tmp/mshqc-basis", ignore_errors=True)

          subprocess.run([sys.executable, "-m", "build", "--sdist", "--outdir", "dist"], check=True)
          PYEOF

          echo "version=$TARGET_VER" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload to PyPI via Twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python3 -m twine check dist/*
          python3 -m twine upload --skip-existing dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.version }}
          name: "mshqc ${{ steps.prep.outputs.version }}"
          body_path: README.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
