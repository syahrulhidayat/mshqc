name: CPC Phase 1 Verification & C++20 Sanitizers

on:
  workflow_dispatch:
    inputs:
      run_error_bounds:
        description: "Jalankan Phase 1 FD4 gradients + Cholesky/Laplace/kappa error-bound tables"
        required: false
        default: true
        type: boolean
      run_asan:
        description: "Jalankan AddressSanitizer + UndefinedBehaviorSanitizer (C++20)"
        required: false
        default: true
        type: boolean
      run_tsan:
        description: "Jalankan ThreadSanitizer (OpenMP race check, terpisah dari ASan)"
        required: false
        default: true
        type: boolean

jobs:
  phase1-error-bounds:
    name: Phase 1 Error Bounds & FD4 Gradients (ubuntu-latest)
    runs-on: ubuntu-latest
    if: inputs.run_error_bounds == true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Basis Sets from mshqc-basis
        shell: bash -eo pipefail {0}
        run: |
          git clone --depth 1 https://github.com/syahrulhidayat/mshqc-basis.git /tmp/mshqc-basis
          mkdir -p data/basis python/mshqc/basis
          cp -rf /tmp/mshqc-basis/data/basis/* data/basis/
          cp -rf /tmp/mshqc-basis/data/basis/* python/mshqc/basis/
          rm -rf /tmp/mshqc-basis

      - name: Set up Micromamba Build Environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: p1_env
          create-args: >-
            -c conda-forge
            python=3.11 cmake ninja make pkg-config cxx-compiler c-compiler
            llvm-openmp eigen openblas liblapacke nanobind setuptools wheel pip
            numpy scipy pytest

      - name: Restore Cached libcint & TBLIS
        uses: actions/cache@v4
        with:
          path: .cache_local_deps
          key: local-geom-deps-Linux-v2

      - name: Install Cached libcint & TBLIS
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate p1_env
          if [ -f ".cache_local_deps/lib/libtblis.a" ] && [ -f ".cache_local_deps/lib/libcint.a" ]; then
            cp -rf .cache_local_deps/include/* "$CONDA_PREFIX/include/"
            cp -rf .cache_local_deps/lib/* "$CONDA_PREFIX/lib/"
          else
            echo "::error::Cache local-geom-deps-Linux-v2 tidak ditemukan; jalankan test_mshqc_hybrid.yml dulu."
            exit 1
          fi

      - name: Build mshqc & Run Phase 1 Verification + Error-Bound Tables
        shell: bash -el {0}
        env:
          OMP_NUM_THREADS: "4"
          TBLIS_NUM_THREADS: "4"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -o pipefail
          micromamba activate p1_env
          export TBLIS_DIR="$CONDA_PREFIX"
          export OpenMP_ROOT="$CONDA_PREFIX"
          export CMAKE_PREFIX_PATH="$CONDA_PREFIX"
          export CMAKE_ARGS="-DOpenMP_ROOT=$CONDA_PREFIX"
          export CMAKE_BUILD_PARALLEL_LEVEL=4
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pytest tests/test_phase1_cpc_verification.py -v -s 2>&1 | tee phase1_pytest_log.txt
          python repro_cpc/run_phase1_error_bounds.py --out-json phase1_error_bounds.json --out-md phase1_error_bounds.md
          cat phase1_error_bounds.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Phase 1 Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-phase1-error-bounds
          path: |
            phase1_pytest_log.txt
            phase1_error_bounds.json
            phase1_error_bounds.md
          if-no-files-found: ignore

  cpp-asan-ubsan:
    name: C++20 ASan + UBSan (ubuntu-latest)
    runs-on: ubuntu-latest
    if: inputs.run_asan == true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Basis Sets from mshqc-basis
        shell: bash -eo pipefail {0}
        run: |
          git clone --depth 1 https://github.com/syahrulhidayat/mshqc-basis.git /tmp/mshqc-basis
          mkdir -p data/basis python/mshqc/basis
          cp -rf /tmp/mshqc-basis/data/basis/* data/basis/
          cp -rf /tmp/mshqc-basis/data/basis/* python/mshqc/basis/
          rm -rf /tmp/mshqc-basis

      - name: Set up Micromamba Build Environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: san_env
          create-args: >-
            -c conda-forge
            python=3.11 cmake ninja make pkg-config cxx-compiler c-compiler
            llvm-openmp eigen openblas liblapacke nanobind setuptools wheel pip
            numpy scipy pytest

      - name: Restore Cached libcint & TBLIS
        uses: actions/cache@v4
        with:
          path: .cache_local_deps
          key: local-geom-deps-Linux-v2

      - name: Install libcint & TBLIS into CONDA_PREFIX
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate san_env
          if [ -f ".cache_local_deps/lib/libtblis.a" ] && [ -f ".cache_local_deps/lib/libcint.a" ]; then
            cp -rf .cache_local_deps/include/* "$CONDA_PREFIX/include/"
            cp -rf .cache_local_deps/lib/* "$CONDA_PREFIX/lib/"
          else
            echo "::error::Cache local-geom-deps-Linux-v2 belum ada; jalankan test_mshqc_hybrid.yml dulu."
            exit 1
          fi

      - name: Build & Run ASan + UBSan Verification
        shell: bash -el {0}
        env:
          OMP_NUM_THREADS: "2"
          TBLIS_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1:strict_string_checks=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          set -o pipefail
          micromamba activate san_env
          export TBLIS_DIR="$CONDA_PREFIX"
          export OpenMP_ROOT="$CONDA_PREFIX"
          export CMAKE_PREFIX_PATH="$CONDA_PREFIX"
          export CMAKE_BUILD_PARALLEL_LEVEL=4
          export CMAKE_ARGS="-DOpenMP_ROOT=$CONDA_PREFIX -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -g' -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined'"
          python -m pip install --no-build-isolation --no-deps -e . -v
          ASAN_LIB=$($CXX -print-file-name=libasan.so)
          if [ ! -f "$ASAN_LIB" ]; then
            ASAN_LIB=$(find "$CONDA_PREFIX" /usr/lib -name "libasan.so*" 2>/dev/null | head -n 1)
          fi
          echo "Using ASAN_LIB=$ASAN_LIB"
          LD_PRELOAD="$ASAN_LIB" python -m pytest             tests/test_thin_core_stage3.py             tests/test_thin_core_stage7.py             tests/test_thin_core_stage8_parity.py             tests/test_phase1_cpc_verification.py -v 2>&1 | tee 01_asan_ubsan_log.txt

      - name: Upload ASan + UBSan Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-asan-ubsan-log
          path: 01_asan_ubsan_log.txt
          if-no-files-found: ignore

  cpp-tsan-openmp:
    name: C++20 TSan OpenMP Race Check (ubuntu-latest)
    runs-on: ubuntu-latest
    if: inputs.run_tsan == true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Basis Sets from mshqc-basis
        shell: bash -eo pipefail {0}
        run: |
          git clone --depth 1 https://github.com/syahrulhidayat/mshqc-basis.git /tmp/mshqc-basis
          mkdir -p data/basis python/mshqc/basis
          cp -rf /tmp/mshqc-basis/data/basis/* data/basis/
          cp -rf /tmp/mshqc-basis/data/basis/* python/mshqc/basis/
          rm -rf /tmp/mshqc-basis

      - name: Set up Micromamba Build Environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tsan_env
          create-args: >-
            -c conda-forge
            python=3.11 cmake ninja make pkg-config cxx-compiler c-compiler
            llvm-openmp eigen openblas liblapacke nanobind setuptools wheel pip
            numpy scipy pytest

      - name: Restore Cached libcint & TBLIS
        uses: actions/cache@v4
        with:
          path: .cache_local_deps
          key: local-geom-deps-Linux-v2

      - name: Install libcint & TBLIS into CONDA_PREFIX
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate tsan_env
          if [ -f ".cache_local_deps/lib/libtblis.a" ] && [ -f ".cache_local_deps/lib/libcint.a" ]; then
            cp -rf .cache_local_deps/include/* "$CONDA_PREFIX/include/"
            cp -rf .cache_local_deps/lib/* "$CONDA_PREFIX/lib/"
          else
            echo "::error::Cache local-geom-deps-Linux-v2 belum ada; jalankan test_mshqc_hybrid.yml dulu."
            exit 1
          fi

      - name: Build & Run TSan OpenMP Verification
        shell: bash -el {0}
        env:
          OMP_NUM_THREADS: "2"
          TBLIS_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
          TSAN_OPTIONS: "halt_on_error=0:second_deadlock_stack=1"
        run: |
          set -o pipefail
          micromamba activate tsan_env
          export TBLIS_DIR="$CONDA_PREFIX"
          export OpenMP_ROOT="$CONDA_PREFIX"
          export CMAKE_PREFIX_PATH="$CONDA_PREFIX"
          export CMAKE_BUILD_PARALLEL_LEVEL=4
          export CMAKE_ARGS="-DOpenMP_ROOT=$CONDA_PREFIX -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS='-fsanitize=thread -fno-omit-frame-pointer -g' -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=thread'"
          python -m pip install --no-build-isolation --no-deps -e . -v
          TSAN_LIB=$($CXX -print-file-name=libtsan.so)
          if [ ! -f "$TSAN_LIB" ]; then
            TSAN_LIB=$(find "$CONDA_PREFIX" /usr/lib -name "libtsan.so*" 2>/dev/null | head -n 1)
          fi
          echo "Using TSAN_LIB=$TSAN_LIB"
          LD_PRELOAD="$TSAN_LIB" python -m pytest             tests/test_thin_core_stage3.py             tests/test_thin_core_stage9_v21.py -v 2>&1 | tee 02_tsan_openmp_log.txt

      - name: Upload TSan OpenMP Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-tsan-openmp-log
          path: 02_tsan_openmp_log.txt
          if-no-files-found: ignore
