name: GPU CUDA Test & Benchmark (Modal Serverless)

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "NVIDIA GPU type di Modal (T4=murah, L4=cepat, A100=FP64 penuh)"
        required: true
        default: "T4"
        type: choice
        options:
          - T4
          - L4
          - A100
      heavy:
        description: "Jalankan juga C6H6 cc-pVTZ (264 BF)"
        required: false
        default: false
        type: boolean

jobs:
  modal_cuda_gpu:
    name: "CUDA FP64 Suite on Modal (${{ inputs.gpu }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Modal Secrets Configured
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Tambahkan MODAL_TOKEN_ID dan MODAL_TOKEN_SECRET di GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up Python & Modal CLI
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: python -m pip install --upgrade modal

      - name: Run mshqc CUDA FP64 Benchmark on Modal GPU
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_GPU: ${{ inputs.gpu }}
        run: |
          EXTRA=""
          if [ "${{ inputs.heavy }}" = "true" ]; then
            EXTRA="--heavy"
          fi
          modal run .modal/gpu_benchmark.py $EXTRA 2>&1 | tee modal_cuda_log.txt

      - name: Publish CUDA Summary & Artifact
        if: always()
        run: |
          if [ -f cuda_gpu_benchmark_summary.md ]; then
            cat cuda_gpu_benchmark_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload CUDA Benchmark Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mshqc-cuda-modal-${{ inputs.gpu }}
          path: |
            modal_cuda_log.txt
            cuda_gpu_benchmark_summary.md
          if-no-files-found: ignore
