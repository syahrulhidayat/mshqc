name: GPU CUDA Test & Benchmark (Modal Serverless)

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "NVIDIA GPU di Modal (T4=smoke murah, A100/H100=FP64 penuh untuk CPC)"
        required: true
        default: "A100"
        type: choice
        options:
          - T4
          - L4
          - A100
          - H100
      mode:
        description: "Mode benchmark: smoke (114 BF), heavy (<=264 BF), cpc_scaling (114..412 BF)"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - heavy
          - cpc_scaling

jobs:
  modal_cuda_gpu:
    name: "CUDA FP64 Suite on Modal (${{ inputs.gpu }} / ${{ inputs.mode }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Modal Secrets Configured
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Tambahkan MODAL_TOKEN_ID dan MODAL_TOKEN_SECRET di GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up Python & Modal CLI
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: python -m pip install --upgrade modal

      - name: Run mshqc CUDA FP64 Benchmark on Modal GPU
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_GPU: ${{ inputs.gpu }}
          MSHQC_GIT_SHA: ${{ github.sha }}
        run: |
          modal run .modal/gpu_benchmark.py --mode "${{ inputs.mode }}" 2>&1 | tee modal_cuda_log.txt

      - name: Publish CUDA Summary
        if: always()
        run: |
          if [ -f cuda_gpu_benchmark_summary.md ]; then
            cat cuda_gpu_benchmark_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload CUDA Benchmark Artifacts (Markdown + Raw JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mshqc-cuda-modal-${{ inputs.gpu }}-${{ inputs.mode }}
          path: |
            modal_cuda_log.txt
            cuda_gpu_benchmark_summary.md
            cuda_gpu_benchmark_raw.json
          if-no-files-found: ignore
