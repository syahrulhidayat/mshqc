name: Compile Locally and Run Full Test & Benchmark Suite (mshqc vs Psi4)

on: 

  workflow_dispatch:

jobs:
  full_test_suite:
    name: Local Build & Full Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      OMP_NUM_THREADS: "4"
      OMP_WAIT_POLICY: "PASSIVE"
      TBLIS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HDF5_USE_FILE_LOCKING: "FALSE"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Fetch Basis Sets from mshqc-basis
        shell: bash -eo pipefail {0}
        run: |
          git clone --depth 1 https://github.com/syahrulhidayat/mshqc-basis.git /tmp/mshqc-basis
          mkdir -p data/basis python/mshqc/basis
          cp -rf /tmp/mshqc-basis/data/basis/* data/basis/
          cp -rf /tmp/mshqc-basis/data/basis/* python/mshqc/basis/
          rm -rf /tmp/mshqc-basis

      - name: Set up Micromamba Build Environment for mshqc (geom_env)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: geom_env
          create-args: >-
            -c conda-forge
            python=3.11
            cmake
            ninja
            make
            pkg-config
            cxx-compiler
            c-compiler
            llvm-openmp
            eigen
            hdf5=1.14.3
            openblas
            liblapacke
            nanobind
            setuptools
            wheel
            pip
            numpy
            scipy
            pytest

      - name: Restore Cached libcint & TBLIS (${{ runner.os }})
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: .cache_local_deps
          key: local-geom-deps-${{ runner.os }}-v2

      - name: Build libcint & TBLIS if Not Cached
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          mkdir -p .cache_local_deps/include .cache_local_deps/lib
          if [ -f ".cache_local_deps/lib/libtblis.a" ] && ( [ -f ".cache_local_deps/lib/libcint.a" ] || [ -f ".cache_local_deps/lib64/libcint.a" ] ); then
            cp -rf .cache_local_deps/include/* "$CONDA_PREFIX/include/"
            cp -rf .cache_local_deps/lib/* "$CONDA_PREFIX/lib/" 2>/dev/null || true
            if [ -d ".cache_local_deps/lib64" ]; then
              cp -rf .cache_local_deps/lib64/* "$CONDA_PREFIX/lib/" 2>/dev/null || true
            fi
          else
            git clone --depth 1 -b v6.1.2 https://github.com/sunqm/libcint.git /tmp/libcint
            cmake -S /tmp/libcint -B /tmp/libcint/build -GNinja \
              -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX" \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_C_FLAGS="-O3 -fPIC -std=gnu17 -Wno-incompatible-pointer-types -Wno-implicit-function-declaration" \
              -DENABLE_EXAMPLE=0 -DENABLE_TEST=0 -DBUILD_SHARED_LIBS=OFF
            cmake --build /tmp/libcint/build -j4
            cmake --install /tmp/libcint/build
            if [ -f "$CONDA_PREFIX/lib64/libcint.a" ] && [ ! -f "$CONDA_PREFIX/lib/libcint.a" ]; then
              cp -f "$CONDA_PREFIX/lib64/libcint.a" "$CONDA_PREFIX/lib/libcint.a"
            fi

            git clone --depth 1 -b v1.2.0 https://github.com/devinamatthews/tblis.git /tmp/tblis
            cd /tmp/tblis
            git submodule update --init --recursive

            python - << 'EOF'
          import pathlib
          p = pathlib.Path('src/external/catch/catch.hpp')
          p.write_text(p.read_text().replace('SIGSTKSZ', '8192'))
          for f in ('src/external/marray/include/short_vector.hpp', 'src/external/marray/include/range.hpp', 'src/util/thread.h'):
              fp = pathlib.Path(f)
              fp.write_text('#include <limits>\n' + fp.read_text())
          tp = pathlib.Path('src/external/tci/tci/task_set.c')
          tp.write_text('#include <stdlib.h>\n' + tp.read_text())
          ep = pathlib.Path('src/external/marray/include/expression.hpp')
          ep.write_text(ep.read_text().replace(
              '#include <x86intrin.h>',
              '#if defined(__GNUC__) && (defined(__x86_64__) || defined(__i386__))\n#include <x86intrin.h>\n#else\n#undef __AVX512F__\n#undef __AVX__\n#undef __SSE2__\n#endif'
          ))
          cp = pathlib.Path('src/util/cpuid.hpp')
          if cp.exists():
              txt = cp.read_text()
              txt = txt.replace('enum {VENDOR_ARM, VENDOR_UNKNOWN}', 'enum {VENDOR_ARM, VENDOR_UNKNOWN};')
              txt = txt.replace('enum {MODEL_ARMV7, MODEL_ARMV8, MODEL_UNKNOWN}', 'enum {MODEL_ARMV7, MODEL_ARMV8, MODEL_UNKNOWN};')
              cp.write_text(txt)
          cx = pathlib.Path('src/util/cpuid.cxx')
          if cx.exists():
              cx.write_text(cx.read_text().replace('strtoi(ptno, pos, 16)', '((void)pos, (int)strtol(ptno.c_str(), NULL, 16))'))
          EOF

            CFG_ARCH="reference"
            if [ "$(uname -m)" = "x86_64" ]; then
              CFG_ARCH="haswell,zen,core2,reference"
            fi
            ./configure --prefix="$CONDA_PREFIX" --enable-static --disable-shared --with-pic --without-hwloc \
              --enable-config="$CFG_ARCH" \
              CFLAGS="-O3 -fPIC -std=gnu17 -Wno-implicit-function-declaration -Wno-incompatible-function-pointer-types" \
              CXXFLAGS="-O3 -fPIC -std=c++17 -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION -D_LIBCPP_ENABLE_CXX17_REMOVED_RANDOM_SHUFFLE"
            make -j4 bin_PROGRAMS= noinst_PROGRAMS= check_PROGRAMS=
            make install bin_PROGRAMS= noinst_PROGRAMS= check_PROGRAMS=

            cd "$GITHUB_WORKSPACE"
            cp -rf "$CONDA_PREFIX/include/cint"*.h "$CONDA_PREFIX/include/tci"* "$CONDA_PREFIX/include/tblis" .cache_local_deps/include/
            cp -rf "$CONDA_PREFIX/lib/libcint.a" "$CONDA_PREFIX/lib/libtblis.a" "$CONDA_PREFIX/lib/libtci.a" .cache_local_deps/lib/
          fi

      - name: Compile mshqc In-Place in geom_env
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          export TBLIS_DIR="$CONDA_PREFIX"
          export OpenMP_ROOT="$CONDA_PREFIX"
          export CMAKE_PREFIX_PATH="$CONDA_PREFIX"
          export CMAKE_ARGS="-DOpenMP_ROOT=$CONDA_PREFIX"
          export CMAKE_BUILD_PARALLEL_LEVEL=4
          python -m pip install --no-build-isolation --no-deps -e . -v
          python -c "import mshqc; print('Compiled mshqc version:', getattr(mshqc, '__version__', 'local-build'))"

      - name: Create Clean Psi4 Environment (psi4_env) & Patch LibXC Table
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba create -y -n psi4_env -c conda-forge python=3.11 psi4 numpy scipy pip

          micromamba activate psi4_env
          if ! python -c "import psi4" >/dev/null 2>&1; then
            echo "Mendeteksi ketidakcocokan fungsional LibXC pada Psi4, menerapkan patch proc_table.py..."
            python - << 'EOF'
          import pathlib, re, sys
          for p in pathlib.Path(sys.prefix).rglob("psi4/driver/procrouting/proc_table.py"):
              txt = p.read_text(encoding="utf-8")
              pattern = r"for key in functionals:\s+ssuper = build_superfunctional_from_dictionary\(functionals\[key\], 1, 1, True\)\[0\]"
              replacement = (
                  "for key in list(functionals.keys()):\n"
                  "    try:\n"
                  "        ssuper = build_superfunctional_from_dictionary(functionals[key], 1, 1, True)[0]\n"
                  "    except Exception:\n"
                  "        functionals.pop(key, None)\n"
                  "        continue"
              )
              new_txt, count = re.subn(pattern, replacement, txt)
              if count > 0:
                  p.write_text(new_txt, encoding="utf-8")
                  print(f"Berhasil melakukan patch proc_table.py pada: {p}")
          EOF
          fi
          python -c "import psi4; print('Psi4 berhasil dimuat di psi4_env, versi:', psi4.__version__)"

      # =========================================================================
      # BAGIAN 1: UNIT TESTS mshqc (geom_env)
      # =========================================================================
      - name: "[01/16] Run Automated Pytest Validation Suite (test_mshqc.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_mshqc.py -v -s 2>&1 | tee 01_pytest_mshqc_log.txt

      - name: "[02/16] Run Universal Geometry Optimizer Unit Test (test_universal_geom_opt.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -u tests/test_universal_geom_opt.py 2>&1 | tee 02_test_universal_geom_opt_log.txt

      - name: "[03/16] Run Analytic 2e Gradient Verification (verify_analytic_grad_2e.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -u tests/verify_analytic_grad_2e.py 2>&1 | tee 03_verify_analytic_grad_2e_log.txt
      - name: "[03b/16] Run Audit & Computational Scaling Verification (verify_audit_and_scaling.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -u tests/verify_audit_and_scaling.py 2>&1 | tee 03b_verify_audit_and_scaling_log.txt

      # =========================================================================
      # BAGIAN 2: CORE BENCHMARK SUITE (mshqc vs Psi4 Terpisah)
      # =========================================================================
      - name: "[04/16] Run mshqc Core Benchmark (test_mshqc2.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -u tests/test_mshqc2.py 2>&1 | tee 04_mshqc_out.txt
          cp 04_mshqc_out.txt mshqc_out.txt

      - name: "[05/16] Run Psi4 Core Benchmark (benc.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate psi4_env
          python -u tests/benc.py 2>&1 | tee 05_psi4_out.txt
          cp 05_psi4_out.txt psi4_out.txt

      - name: "[06/16] Compare Head-to-Head mshqc vs Psi4 (compare_mshqc_psi4.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -u tests/compare_mshqc_psi4.py mshqc_out.txt psi4_out.txt 2>&1 | tee 06_compare_mshqc_psi4_log.txt

      # =========================================================================
      # BAGIAN 3: BAB 4 BENCHMARK SUITE (mshqc vs Psi4 Terpisah)
      # =========================================================================
      - name: "[07/16] Run mshqc Bab 4 Benchmark (run_mshqc_bab4.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -u tests/run_mshqc_bab4.py 2>&1 | tee mshqc_bab4_stdout.txt
          if [ -f mshqc_bab4_test.txt ]; then
            cp mshqc_bab4_test.txt 07_mshqc_bab4_running_log.txt
          else
            cp mshqc_bab4_stdout.txt 07_mshqc_bab4_running_log.txt
          fi

      - name: "[08/16] Run Psi4 Bab 4 Reference Benchmark (run_psi4_bab4.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate psi4_env
          python -u tests/run_psi4_bab4.py 2>&1 | tee psi4_bab4_stdout.txt
          if [ -f psi4_bab4_test.txt ]; then
            cp psi4_bab4_test.txt 08_psi4_bab4_running_log.txt
          else
            cp psi4_bab4_stdout.txt 08_psi4_bab4_running_log.txt
          fi

      - name: "[09/16] Compare Bab 4 Results (compare_bab4.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -u tests/compare_bab4.py 2>&1 | tee compare_bab4_stdout.txt
          if [ -f test_bab4_benchmark.txt ]; then
            cp test_bab4_benchmark.txt 09_compare_bab4_log.txt
          else
            cp compare_bab4_stdout.txt 09_compare_bab4_log.txt
          fi

      # =========================================================================
      # BAGIAN 4: UNIVERSAL BENCHMARK SUITE (mshqc vs Psi4 Terpisah)
      # =========================================================================
      - name: "[10/16] Run mshqc Universal Suite (run_mshqc_universal.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -u tests/run_mshqc_universal.py 2>&1 | tee 10_mshqc_universal_running_log.txt

      - name: "[11/16] Run Psi4 Universal Reference Suite (run_psi4_universal.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate psi4_env
          python -u tests/run_psi4_universal.py 2>&1 | tee 11_psi4_universal_running_log.txt

      - name: "[12/16] Compare Universal Benchmark Tables (compare_universal.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          if [ -f "mshqc_universal_raw.json" ] && [ -f "psi4_universal_raw.json" ]; then
            python -u tests/compare_universal.py mshqc_universal_raw.json psi4_universal_raw.json 2>&1 | tee 12_compare_universal_log.txt
          else
            python -u tests/compare_universal.py 2>&1 | tee 12_compare_universal_log.txt
          fi

      # =========================================================================
      # BAGIAN 5: GEOMETRY & VIBRATIONAL SUITE (mshqc vs Psi4 Terpisah)
      # =========================================================================
      - name: "[13/16] Run mshqc Multi-System Geometry Suite (run_mshqc_geom.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -u tests/run_mshqc_geom.py 2>&1 | tee 13_mshqc_geom_running_log.txt

      - name: "[14/16] Run Psi4 Multi-System Geometry Reference Suite (run_psi4_geom.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate psi4_env
          python -u tests/run_psi4_geom.py 2>&1 | tee 14_psi4_geom_running_log.txt
          test -s psi4_geom_raw.json

      - name: "[15/16] Compare Head-to-Head Geometry & Vibrational Tables (compare_geom.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -u tests/compare_geom.py mshqc_geom_raw.json psi4_geom_raw.json 2>&1 | tee compare_geom_stdout.txt
          if [ -f test_geom_validation.txt ]; then
            cp test_geom_validation.txt 15_compare_geom_log.txt
          else
            cp compare_geom_stdout.txt 15_compare_geom_log.txt
          fi
          grep -q "Total Matched Geometry Runs: 24" 15_compare_geom_log.txt

      # =========================================================================
      # BAGIAN 6: HYBRID BENCHMARK (.OH RADICAL) VIA ISOLATED SUBPROCESS BRIDGE
      # =========================================================================
      - name: "[16/16] Run .OH Radical Geometry & Frequency Benchmark (benchmark_geom_omp2_psi4.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          PSI4_PY="$MAMBA_ROOT_PREFIX/envs/psi4_env/bin/python"
          export PSI4_PY
          python - << 'EOF'
          import os, pathlib, sysconfig
          purelib = pathlib.Path(sysconfig.get_paths()["purelib"])
          psi4_py = os.environ["PSI4_PY"]
          bridge_code = f'''import json, subprocess, numpy as np

          PSI4_BIN = {psi4_py!r}
          _OPTS = {{}}

          class _Core:
              @staticmethod
              def clean(): pass
              @staticmethod
              def clean_options(): _OPTS.clear()
              @staticmethod
              def set_output_file(path, append=False): pass

          core = _Core()

          class _Mol:
              def __init__(self, geom_str):
                  self.geom_str = geom_str
                  self._coords = None
              def geometry(self):
                  return self._coords

          def geometry(geom_str):
              return _Mol(geom_str)

          def set_options(opts):
              _OPTS.update(opts)

          def optimize(method, molecule=None, dertype=None):
              payload = json.dumps({{
                  "method": method,
                  "geom": molecule.geom_str,
                  "opts": _OPTS,
                  "dertype": dertype,
              }})
              runner = """import os, sys, json, tempfile, numpy as np
          os.environ["PSI_SCRATCH"] = "/dev/shm" if os.path.isdir("/dev/shm") and os.access("/dev/shm", os.W_OK) else tempfile.gettempdir()
          import psi4
          psi4.set_num_threads(int(os.environ.get("OMP_NUM_THREADS", "4")))
          psi4.set_memory("4 GB")
          psi4.core.set_output_file("/dev/null", False)
          data = json.loads(sys.argv[1])
          psi4.core.clean()
          psi4.core.clean_options()
          import time
          mol = psi4.geometry(data["geom"])
          psi4.set_options(data["opts"])
          t0 = time.perf_counter()
          if data["dertype"] is not None:
              e = float(psi4.optimize(data["method"], molecule=mol, dertype=data["dertype"]))
          else:
              e = float(psi4.optimize(data["method"], molecule=mol))
          dt = time.perf_counter() - t0
          coords = np.asarray(mol.geometry()).tolist()
          print("PSI4_JSON_RESULT:" + json.dumps({{"e": e, "coords": coords, "dt": dt}}))
          """
              proc = subprocess.run([PSI4_BIN, "-c", runner, payload], capture_output=True, text=True, check=True)
              for line in reversed(proc.stdout.splitlines()):
                  if line.startswith("PSI4_JSON_RESULT:"):
                      res = json.loads(line.split("PSI4_JSON_RESULT:", 1)[1])
                      molecule._coords = np.asarray(res["coords"], dtype=np.float64)
                      return float(res["e"])
              raise RuntimeError(f"Psi4 subprocess gagal:\\n{{proc.stdout}}\\n{{proc.stderr}}")
          '''
          (purelib / "psi4.py").write_text(bridge_code, encoding="utf-8")
          EOF

          python -u tests/benchmark_geom_omp2_psi4.py 2>&1 | tee 16_benchmark_geom_oh_psi4_log.txt
          if grep -q "N/A" 16_benchmark_geom_oh_psi4_log.txt; then
            echo "ERROR: Ditemukan nilai N/A pada hasil Psi4 di 16_benchmark_geom_oh_psi4_log.txt!"
            exit 1
          fi

      # =========================================================================
      # BAGIAN 7: HEAVY ATOMS (Z=18..36) & LARGE MOLECULES (mshqc vs Psi4 Terpisah)
      # =========================================================================
      - name: "[17/19] Run mshqc Heavy & Large Molecule Suite (run_mshqc_heavy_large.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -u tests/run_mshqc_heavy_large.py 2>&1 | tee 17_mshqc_heavy_large_running_log.txt
          test -s mshqc_heavy_large_raw.json

      - name: "[18/19] Run Psi4 Heavy & Large Molecule Reference Suite (run_psi4_heavy_large.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate psi4_env
          python -u tests/run_psi4_heavy_large.py 2>&1 | tee 18_psi4_heavy_large_running_log.txt
          test -s psi4_heavy_large_raw.json

      - name: "[19/19] Compare Heavy & Large Molecule Tables (compare_heavy_large.py)"
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -u tests/compare_heavy_large.py mshqc_heavy_large_raw.json psi4_heavy_large_raw.json 2>&1 | tee 19_compare_heavy_large_log.txt
          grep -q "Total Matched Heavy/Large Runs: 8" 19_compare_heavy_large_log.txt
      # =========================================================================
      # UPLOAD ARTIFACTS (.txt & .json)
      # =========================================================================
      - name: Upload All Test & Benchmark Logs (.txt & .json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mshqc-vs-psi4-full-logs-${{ matrix.os }}
          path: |
            01_pytest_mshqc_log.txt
            02_test_universal_geom_opt_log.txt
            03_verify_analytic_grad_2e_log.txt
            03b_verify_audit_and_scaling_log.txt
            04_mshqc_out.txt
            05_psi4_out.txt
            06_compare_mshqc_psi4_log.txt
            07_mshqc_bab4_running_log.txt
            08_psi4_bab4_running_log.txt
            09_compare_bab4_log.txt
            10_mshqc_universal_running_log.txt
            11_psi4_universal_running_log.txt
            12_compare_universal_log.txt
            13_mshqc_geom_running_log.txt
            14_psi4_geom_running_log.txt
            15_compare_geom_log.txt
            16_benchmark_geom_oh_psi4_log.txt
            mshqc_geom_raw.json
            psi4_geom_raw.json
            comparison_summary.md
        