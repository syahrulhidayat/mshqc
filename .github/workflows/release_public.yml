name: Compile and Release Wheel to Public Repo

on:
  push:
    branches: [ "fitur_tblis-dan-perbaikan-code" ]
   
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Private Source Code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.MY_GITHUB_TOKEN }} # Gunakan GitHub Secrets
    # =======================================================================
    # 1. CACHE CONDA & PIP
    # =========================================================================
    - name: Cache Conda Packages
      uses: actions/cache@v3
      with:
        path: ~/conda_pkgs_dir
        key: conda-pkgs-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          conda-pkgs-${{ runner.os }}-

    # =========================================================================
    # 2. CCACHE: Compiler Cache
    # =========================================================================
    - name: Setup Compiler Cache (ccache)
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-mshqc-ccache
        max-size: 500M

    - name: Setup Conda Environment (Python 3.12)
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: "3.12"
        channels: conda-forge
        use-only-tar-bz2: true 

    # =========================================================================
    # 3. INSTALL BUILD DEPENDENCIES
    # =========================================================================
    - name: Install Build Dependencies
      shell: bash -el {0}
      run: |
        conda install -y -c conda-forge cmake make compilers eigen pkg-config "hdf5=1.14.3" pip libcint tblis liblapacke openblas psi4
        python -m pip install build wheel nanobind auditwheel

    # =========================================================================
    # 4. BUILD & REPAIR WHEEL (KUNCI KOMPATIBILITAS UNIVERSAL)
    # =========================================================================
    - name: Build and Repair Python Wheel (.whl)
      shell: bash -el {0}
      run: |
        export CC="ccache $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc"
        export CXX="ccache $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++"
        export CXXFLAGS="-std=c++17 -fopenmp -O3 -mavx2 -mfma -mtune=generic -DEIGEN_USE_BLAS -DEIGEN_USE_LAPACKE -DNDEBUG"
        
        # 1. Build roda mentah ke folder dist/
        echo ">> Membangun roda biner mentah..."
        python setup.py bdist_wheel
        
        # 2. Injeksi dependencies (HDF5, TBLIS, dll) ke dalam roda
        echo ">> Memperbaiki roda untuk kompatibilitas lintas-Linux (manylinux)..."
        # auditwheel akan mengekstrak roda di dist/, memasukkan .so, dan menaruh hasil akhirnya di wheelhouse/
        auditwheel repair dist/*.whl --wheel-dir wheelhouse/
        
        ccache -s

    # =========================================================================
    # 5. COMMIT KEMBALI KE REPO PRIVAT
    # =========================================================================
    - name: Commit and Push Wheel to Private Repo
      shell: bash -el {0}
      run: |
        git config --global user.name "MSHQC Automation"
        git config --global user.email "automation@mshqc.internal"
        
        mkdir -p releases
        rm -f releases/*.whl
        
        cp wheelhouse/*.whl releases/
        
        # Ditambahkan -f agar lolos dari jeratan .gitignore
        git add -f releases/*.whl
        
        if git diff-index --quiet HEAD --; then
          echo "Tidak ada perubahan biner baru untuk disimpan di repo privat."
        else
          git commit -m "CI-Bot: Update biner terkompilasi (.whl) [skip ci]"
          git push origin HEAD # Dorong aman ke cabang aktif Anda saat ini
        fi

    # =========================================================================
    # 6. DEPLOY KE REPO PUBLIK
    # =========================================================================
    - name: Deploy Wheel to Public Repository
      shell: bash -el {0}
      env:
        API_TOKEN_GITHUB: ${{ secrets.MY_GITHUB_TOKEN }} 
      run: |
        git config --global user.name "MSHQC Automation"
        git config --global user.email "automation@mshqc.internal"

        git clone https://x-access-token:${API_TOKEN_GITHUB}@github.com/mshqc/mshqc-public.git public_repo

        mkdir -p public_repo/releases
        rm -f public_repo/releases/*.whl
        
        # [PENTING] Ambil dari folder wheelhouse, BUKAN dist
        cp wheelhouse/*.whl public_repo/releases/ 2>/dev/null || true
        cp -r data public_repo/ 2>/dev/null || true

        cd public_repo
        git add -A
        
        if git diff-index --quiet HEAD --; then
          echo "Tidak ada pembaruan pada biner mshqc."
        else
          git commit -m "Auto-Deploy: Rilis MSHQC Wheel (.whl) Aman"
          git push origin main
        fi
