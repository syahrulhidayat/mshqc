name: Compile and Release Wheel to Public Repo

on:
  push:
    branches: [ "lembaran-baru"] # Memicu otomatisasi di branch pengembanganmu

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Private Source Code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.MY_GITHUB_TOKEN }} # [FIX] Sintaks pemanggilan rahasia yang benar

    # =========================================================================
    # 1. CACHE CONDA & PIP
    # =========================================================================
    - name: Cache Conda Packages
      uses: actions/cache@v3
      with:
        path: ~/conda_pkgs_dir
        key: conda-pkgs-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          conda-pkgs-${{ runner.os }}-

    # =========================================================================
    # 2. CCACHE: Compiler Cache (Rahasia Incremental Build C++ di Cloud)
    # =========================================================================
    - name: Setup Compiler Cache (ccache)
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-mshqc-ccache
        max-size: 500M

    - name: Setup Conda Environment (Python 3.12)
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: "3.12"
        channels: conda-forge
        use-only-tar-bz2: true 

    # =========================================================================
    # 3. KUNCI ULTIMATE STACK (SINKRON DENGAN CMakeLists.txt)
    # =========================================================================
    - name: Install Build Dependencies (Sync with Psi4)
      shell: bash -el {0}
      run: |
        conda install -y -c conda-forge cmake make compilers eigen pkg-config "hdf5=1.14.3" pip libcint tblis liblapacke openblas psi4
        python -m pip install build wheel nanobind

    - name: Build Python Wheel (.whl)
      shell: bash -el {0}
      run: |
        export CC="ccache $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc"
        export CXX="ccache $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++"
        
        export CXXFLAGS="-std=c++17 -fopenmp -O3 -mavx2 -mfma -mtune=generic -DEIGEN_USE_BLAS -DEIGEN_USE_LAPACKE -DNDEBUG"
        export CMAKE_BUILD_PARALLEL_LEVEL=4 
        
        python setup.py bdist_wheel
        
        # Tampilkan statistik Ccache untuk membuktikan cache bekerja
        ccache -s

    # =========================================================================
    # 4. COMMIT KEMBALI KE REPO PRIVAT (Dinamis Mengikuti Branch)
    # =========================================================================
    - name: Commit and Push Wheel to Private Repo
      shell: bash -el {0}
      run: |
        git config --global user.name "MSHQC Automation"
        git config --global user.email "automation@mshqc.internal"
        
        mkdir -p releases
        rm -f releases/*.whl
        
        cp dist/*.whl releases/
        
        git add releases/*.whl
        
        if git diff-index --quiet HEAD --; then
          echo "Tidak ada perubahan biner baru untuk disimpan di repo privat."
        else
          git commit -m "CI-Bot: Update biner terkompilasi (.whl) [skip ci]"
          # [FIX] Push dinamis agar tidak menabrak branch main saat bekerja di branch lain
          git push origin HEAD:${GITHUB_REF#refs/heads/}
        fi

    # =========================================================================
    # 5. DEPLOY KE REPO PUBLIK
    # =========================================================================
    - name: Deploy Wheel to Public Repository (Closed-Source Mode)
      shell: bash -el {0}
      env:
        API_TOKEN_GITHUB: ${{ secrets.MY_GITHUB_TOKEN }} # [FIX] Sintaks pemanggilan rahasia
      run: |
        git config --global user.name "MSHQC Automation"
        git config --global user.email "automation@mshqc.internal"

        git clone https://x-access-token:${API_TOKEN_GITHUB}@github.com/syahrulhidayat/mshqc-public.git public_repo

        mkdir -p public_repo/releases
        rm -f public_repo/releases/*.whl
        
        cp dist/*.whl public_repo/releases/ 2>/dev/null || true
        cp -r data public_repo/ 2>/dev/null || true

        cd public_repo
        git add -A
        
        if git diff-index --quiet HEAD --; then
          echo "Tidak ada pembaruan pada biner mshqc."
        else
          git commit -m "Auto-Deploy: Rilis MSHQC Wheel (.whl) Aman"
          git push origin main
        fi
