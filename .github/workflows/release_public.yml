name: Compile and Release Wheel to Public Repo

on:
  push:
    branches: [ "main" ] # Memicu otomatisasi setiap kali push ke branch main privat
   
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # PERBAIKAN 1: Tambahkan izin tulis agar bot bisa melakukan git push kembali ke repo
    permissions:
      contents: write 

    steps:
    - name: Checkout Private Source Code
      uses: actions/checkout@v3
      with:
        # PERBAIKAN 2: Gunakan GitHub Secrets untuk memanggil token, BUKAN string murni
        token: ${{'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' }} 

    # =========================================================================
    # 1. CACHE CONDA & PIP: Menyimpan unduhan library agar tidak install dari 0
    # =========================================================================
    - name: Cache Conda Packages
      uses: actions/cache@v3
      with:
        path: ~/conda_pkgs_dir
        key: conda-pkgs-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          conda-pkgs-${{ runner.os }}-

    # =========================================================================
    # 2. CCACHE: Compiler Cache (Rahasia Incremental Build C++ di Cloud)
    # =========================================================================
    - name: Setup Compiler Cache (ccache)
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-mshqc-ccache
        max-size: 500M

    - name: Setup Conda Environment (Python 3.12)
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: "3.12"
        channels: conda-forge
        use-only-tar-bz2: true 

    # =========================================================================
    # 🔥 PENTING: Kunci versi HDF5=1.14.3 agar ABI .so stabil di semua perangkat!
    # =========================================================================
    - name: Install Build Dependencies (Sync with Psi4)
      shell: bash -el {0}
      run: |
        conda install -y -c conda-forge cmake make compilers eigen pkg-config "hdf5=1.14.3" pip libcint tblis liblapacke openblas psi4
        python -m pip install build wheel nanobind

    - name: Build Python Wheel (.whl)
      shell: bash -el {0}
      run: |
        # PERBAIKAN 3: Gunakan variabel lingkungan Conda yang aman agar tidak memutus dependensi bawaan
        export CC="ccache ${CC:-$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc}"
        export CXX="ccache ${CXX:-$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++}"
        export CXXFLAGS="${CXXFLAGS:-} -std=c++17 -fopenmp -O3 -mavx2 -mfma -mtune=generic -DEIGEN_USE_BLAS -DEIGEN_USE_LAPACKE -DNDEBUG"
        
        # PERBAIKAN 4: Gunakan modul build modern menggantikan bdist_wheel yang sudah usang
        python -m build --wheel
        
        # Tampilkan statistik Ccache untuk membuktikan cache bekerja
        ccache -s

    # =========================================================================
    # 3. COMMIT KEMBALI KE REPO PRIVAT (Agar Lokal Bisa Pull)
    # =========================================================================
    - name: Commit and Push Wheel to Private Repo
      shell: bash -el {0}
      run: |
        git config --global user.name "MSHQC Automation"
        git config --global user.email "automation@mshqc.internal"
        
        mkdir -p releases
        rm -f releases/*.whl
        
        # PERBAIKAN 5: Tambahkan proteksi 2>/dev/null agar pipeline tidak mati jika dist kosong
        cp dist/*.whl releases/ 2>/dev/null || true
        
        git add releases/*.whl
        
        if git diff-index --quiet HEAD --; then
          echo "Tidak ada perubahan biner baru untuk disimpan di repo privat."
        else
          git commit -m "CI-Bot: Update biner terkompilasi (.whl) [skip ci]"
          # PERBAIKAN 6: Perbaiki jebakan Detached HEAD dengan push yang eksplisit
          git push origin HEAD:main
        fi

    # =========================================================================
    # 4. DEPLOY KE REPO PUBLIK
    # =========================================================================
    - name: Deploy Wheel to Public Repository (Closed-Source Mode)
      shell: bash -el {0}
      env:
        # Panggil secret token yang sama seperti di langkah checkout awal
        API_TOKEN_GITHUB: ${{ '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' }} 
      run: |
        git config --global user.name "MSHQC Automation"
        git config --global user.email "automation@mshqc.internal"

        git clone https://x-access-token:${API_TOKEN_GITHUB}@github.com/syahrulhidayat/mshqc-public.git public_repo

        mkdir -p public_repo/releases
        rm -f public_repo/releases/*.whl
        
        cp dist/*.whl public_repo/releases/ 2>/dev/null || true
        cp -r data public_repo/ 2>/dev/null || true

        cd public_repo
        git add -A
        
        if git diff-index --quiet HEAD --; then
          echo "Tidak ada pembaruan pada biner mshqc."
        else
          git commit -m "Auto-Deploy: Rilis MSHQC Wheel (.whl) Aman"
          git push origin main
        fi
