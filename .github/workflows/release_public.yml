name: Compile and Release Wheel to Public Repoo

on:
  push:
    branches: [ "debug2" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Private Source Code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.MY_GITHUB_TOKEN }} 
        fetch-depth: 0 

    # ==============================================================================
    # 1. SETUP CONDA (Python 3.14 + MKL)
    # ==============================================================================
    - name: Setup Conda Environment (Python 3.14)
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: "3.14"
        channels: conda-forge
        use-only-tar-bz2: false 

    - name: Install Build Dependencies
      shell: bash -el {0}
      run: |
        conda install -y -c conda-forge cmake make compilers eigen pkg-config "hdf5=1.14.3" pip liblapacke mkl mkl-devel mkl-include
        python -m pip install build wheel nanobind setuptools

    - name: Cache Custom libcint
      id: cache-libcint
      uses: actions/cache@v3
      with:
        path: ~/libcint_install
        key: libcint-v6.1.2-hpc-avx2-fpic-static 

    - name: Compile libcint (HPC Optimized)
      if: steps.cache-libcint.outputs.cache-hit != 'true'
      shell: bash -el {0}
      run: |
        echo "Cache libcint tidak ditemukan. Mengompilasi dari Source..."
        git clone -b v6.1.2 https://github.com/sunqm/libcint.git /tmp/libcint
        cd /tmp/libcint
        mkdir build && cd build

        export CFLAGS="-O3 -fPIC -mavx2 -mfma -mno-avx512f -funroll-loops -fno-math-errno"
        export CXXFLAGS="-O3 -fPIC -mavx2 -mfma -mno-avx512f -funroll-loops -fno-math-errno"

        # TAMBAHKAN -DBUILD_SHARED_LIBS=OFF DI SINI
        cmake -DCMAKE_INSTALL_PREFIX=$HOME/libcint_install \
              -DCMAKE_C_FLAGS="$CFLAGS" \
              -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
              -DENABLE_EXAMPLE=0 \
              -DENABLE_TEST=0 \
              -DBUILD_SHARED_LIBS=OFF \
              ..
        
        make -j 4
        make install
    # =========================================================================
    # 2B. CACHE & COMPILE TBLIS
    # =========================================================================
    - name: Cache Custom TBLIS
      id: cache-tblis
      uses: actions/cache@v3
      with:
        path: ~/tblis_install
        key: tblis-v1.2.0-static-avx2-fpic-mkl-py314

    - name: Compile TBLIS (Static + Safe AVX2)
      if: steps.cache-tblis.outputs.cache-hit != 'true'
      shell: bash -el {0}
      run: |
        echo "Cache TBLIS tidak ditemukan. Mengompilasi dari Source..."
        git clone -b v1.2.0 https://github.com/devinamatthews/tblis.git /tmp/tblis
        cd /tmp/tblis
        git submodule update --init --recursive
        
        # [PATCH KOMPATIBILITAS GCC 14]
        sed -i 's/SIGSTKSZ/8192/g' src/external/catch/catch.hpp
        sed -i '1i #include <limits>' src/external/marray/include/short_vector.hpp
        sed -i '1i #include <limits>' src/external/marray/include/range.hpp
        sed -i '1i #include <limits>' src/util/thread.h
        
        # --- PERUBAHAN KRUSIAL ---
        export CFLAGS="-O3 -fPIC -mno-avx512f -mno-avx512vl -mno-avx512dq -mno-avx512bw -mno-avx512cd"
        export CXXFLAGS="-O3 -fPIC -mno-avx512f -mno-avx512vl -mno-avx512dq -mno-avx512bw -mno-avx512cd"

        ./configure --prefix=$HOME/tblis_install \
                    --enable-static --disable-shared \
                    --without-hwloc \
                    --enable-config=haswell,zen,core2,sandybridge,bulldozer,piledriver,excavator,reference \
                    CXXFLAGS="$CXXFLAGS" \
                    CFLAGS="$CFLAGS"
                    
        make -j 4
        make install

    # =========================================================================
    # 3. CCACHE & BUILD MSHQC WHEEL
    # =========================================================================
    - name: Setup Compiler Cache (ccache)
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-mshqc-ccache-mkl-py314
        max-size: 500M

    - name: Build Python Wheel (.whl)
      shell: bash -el {0}
      run: |
        export CC="ccache $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc"
        export CXX="ccache $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++" 
        export CXXFLAGS="-std=c++17 -fopenmp -O3 -mavx2 -mfma -mno-avx512f -mtune=generic -DEIGEN_USE_MKL_ALL -DNDEBUG -I$HOME/tblis_install/include -I$HOME/libcint_install/include -I$CONDA_PREFIX/include"
        export LDFLAGS="-lquadmath"   
        export CMAKE_PREFIX_PATH=$HOME/libcint_install:$HOME/tblis_install:$CONDA_PREFIX
        export TBLIS_DIR=$HOME/tblis_install
        
        python setup.py bdist_wheel
        ccache -s

    # =========================================================================
    # 4. COMMIT KEMBALI KE REPO PRIVAT
    # =========================================================================
    - name: Commit and Push Wheel to Private Repo
      shell: bash -el {0}
      run: |
        git config --global user.name "MSHQC Automation"
        git config --global user.email "automation@mshqc.internal"
        
        mkdir -p releases
        rm -f releases/*.whl
        
        cp dist/*.whl releases/
        
        git add releases/*.whl
        
        if git diff-index --quiet HEAD --; then
          echo "Tidak ada perubahan biner baru untuk disimpan di repo privat."
        else
          git commit -m "CI-Bot: Update biner terkompilasi (.whl) [skip ci]"
          git push origin debug2
        fi

