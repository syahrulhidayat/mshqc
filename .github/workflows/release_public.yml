name: Compile and Push Binary to Public Repo

on:
  push:
    branches: [ "main" ] # Memicu otomatisasi setiap kali push ke branch main privat

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Private Source Code
      uses: actions/checkout@v3

    - name: Setup Conda Environment (Python 3.12)
      uses: conda-incubator/setup-miniconda@v2
      with:
        auto-update-conda: true
        python-version: "3.12"
        channels: conda-forge

    - name: Install Build Dependencies
      shell: bash -el {0}
      run: |
        # Mengunduh seluruh pustaka kuantum (compiler, Eigen, BLAS, LAPACKE, pkg-config, HDF5)
        conda install -y -c conda-forge cmake make compilers eigen openblas liblapacke pkg-config hdf5 pip
        
        # Pustaka khusus kimia kuantum dari conda-forge
        conda install -y -c conda-forge libcint tblis
        
        # Instalasi nanobind
        python -m pip install nanobind

    - name: Compile C++ Source to Shared Object (.so)
      shell: bash -el {0}
      run: |
        # 1. Bertanya kepada Python di mana letak folder konfigurasi CMake milik nanobind
        NANO_PATH=$(python -m nanobind --cmake_dir)
        echo "Ditemukan nanobind di: $NANO_PATH"
        
        # 2. Proses Kompilasi
        mkdir build && cd build
        
        # 3. Menyuntikkan NANO_PATH secara paksa ke dalam CMake
        cmake -DCMAKE_BUILD_TYPE=Release -Dnanobind_DIR="$NANO_PATH" ..
        
        make -j$(nproc)
        
        # Verifikasi apakah file .so berhasil tercipta
        ls -la *.so || ls -la src/*.so

    - name: Deploy Binary to Public Repository
      shell: bash -el {0}
      env:
        API_TOKEN_GITHUB: ${{'rhahasia'}}
      run: |
        # 1. Konfigurasi identitas Git di server temporer
        git config --global user.name "MSHQC Automation"
        git config --global user.email "automation@mshqc.internal"

        # 2. Clone repositori publik secara lokal di dalam server Actions
        git clone https://x-access-token:${API_TOKEN_GITHUB}@github.com/syahrulhidayat/mshqc-public.git public_repo

        # 3. Buat struktur folder distribusi paket python di repo publik
        mkdir -p public_repo/mshqc
        
        # 4. Salin library C++ utama (core engine mshqc) dari folder build
        cp build/*.so public_repo/mshqc/ 2>/dev/null || true

        # 5. Salin ekstensi nanobind (_mshqc.so) DAN seluruh file Python murni (*.py)
        # Ini akan memastikan __init__.py, calculators.py, session.py Anda ikut terbawa utuh!
        cp python/mshqc/*.so public_repo/mshqc/ 2>/dev/null || true
        cp -r python/mshqc/*.py public_repo/mshqc/ 2>/dev/null || true
        cp -r data public_repo/mshqc/ 2>/dev/null || true

        # 6. Masuk ke folder publik, rekam perubahan, commit, dan push
        cd public_repo
        git add -A
        
        # Cek apakah ada perubahan nyata sebelum commit agar tidak memicu error kosong
        if git diff-index --quiet HEAD --; then
          echo "Tidak ada perubahan biner baru yang terdeteksi."
        else
          git commit -m "Automated build release: Update mshqc binary (.so) to latest core"
          git push origin main
        fi