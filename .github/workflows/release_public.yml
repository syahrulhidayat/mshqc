name: Compile and Release Wheel to Public Repo

on:
  push:
    branches: [ "mshqc-1.0.3" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # =========================================================================
    # 1. SETUP ENVIRONMENT DETERMINISTIK
    # =========================================================================
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: "3.10"
        activate-environment: mshqc_314
        channels: conda-forge, defaults
        use-only-tar-bz2: true

    - name: Install Toolchain & Dependencies
      run: |
        conda install -y cmake make ninja compilers pkg-config ccache \
          eigen "hdf5=1.14.3" liblapacke mkl mkl-devel mkl-include
        python -m pip install --upgrade pip
        python -m pip install cmake ninja build wheel nanobind setuptools

    # =========================================================================
    # 2. KONFIGURASI CCACHE
    # =========================================================================
    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    # =========================================================================
    # 3. CACHE & KOMPILASI LIBCINT
    # =========================================================================
    - name: Cache libcint
      id: cache-libcint
      uses: actions/cache@v4
      with:
        path: ~/libcint_install
        key: ${{ runner.os }}-libcint-v6.1.2

    - name: Compile libcint
      if: steps.cache-libcint.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 -b v6.1.2 https://github.com/sunqm/libcint.git /tmp/libcint
        cd /tmp/libcint && mkdir build && cd build
        export CFLAGS="-O3 -fPIC -mavx2 -mfma -mno-avx512f -funroll-loops -fno-math-errno -Wno-incompatible-pointer-types -std=gnu17"
        cmake -DCMAKE_INSTALL_PREFIX=$HOME/libcint_install \
              -DCMAKE_C_FLAGS="$CFLAGS" \
              -DENABLE_EXAMPLE=0 -DENABLE_TEST=0 -DBUILD_SHARED_LIBS=OFF ..
        make -j$(nproc) && make install

    # =========================================================================
    # 4. CACHE & KOMPILASI TBLIS (Blok yang sebelumnya tidak sengaja Anda hapus)
    # =========================================================================
    - name: Cache TBLIS
      id: cache-tblis
      uses: actions/cache@v4
      with:
        path: ~/tblis_install
        key: ${{ runner.os }}-tblis-v1.2.0

    - name: Compile TBLIS
      if: steps.cache-tblis.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 -b v1.2.0 https://github.com/devinamatthews/tblis.git /tmp/tblis
        cd /tmp/tblis && git submodule update --init --recursive
        
        sed -i 's/SIGSTKSZ/8192/g' src/external/catch/catch.hpp
        sed -i '1i #include <limits>' src/external/marray/include/short_vector.hpp
        sed -i '1i #include <limits>' src/external/marray/include/range.hpp
        sed -i '1i #include <limits>' src/util/thread.h
        
        export CFLAGS="-O3 -fPIC -mno-avx512f -mno-avx512vl -mno-avx512dq -mno-avx512bw -mno-avx512cd -Wno-incompatible-pointer-types -std=gnu17"
        export CXXFLAGS="-O3 -fPIC -mno-avx512f -mno-avx512vl -mno-avx512dq -mno-avx512bw -mno-avx512cd -Wno-incompatible-pointer-types -std=gnu++17"
        ./configure --prefix=$HOME/tblis_install --enable-static --disable-shared \
                    --without-hwloc --enable-config=haswell,zen,core2,sandybridge,bulldozer,piledriver,excavator,reference \
                    CXXFLAGS="$CXXFLAGS" CFLAGS="$CFLAGS"
        make -j$(nproc) && make install

    # =========================================================================
    # 5. BUILD MSHQC WHEEL (PEP 517 / No-Isolation)
    # =========================================================================
    - name: Build Python Wheel (.whl)
      run: |
        rm -rf dist/ build/ release/ python/*.egg-info *.egg-info
        mkdir -p release
        
        export CC="ccache gcc"
        export CXX="ccache g++"
        export CXXFLAGS="-std=c++20 -fopenmp -O3 -mavx2 -mfma -mno-avx512f -mtune=generic -DEIGEN_USE_MKL_ALL -DNDEBUG -I$HOME/tblis_install/include -I$HOME/libcint_install/include -I$CONDA_PREFIX/include"
        
        LIBCINT_LIB=$( [ -d "$HOME/libcint_install/lib64" ] && echo "$HOME/libcint_install/lib64" || echo "$HOME/libcint_install/lib" )
        TBLIS_LIB=$( [ -d "$HOME/tblis_install/lib64" ] && echo "$HOME/tblis_install/lib64" || echo "$HOME/tblis_install/lib" )
        
        export LDFLAGS="-L$LIBCINT_LIB -L$TBLIS_LIB -L$CONDA_PREFIX/lib -lquadmath"
        export CMAKE_PREFIX_PATH="$HOME/libcint_install:$HOME/tblis_install:$CONDA_PREFIX"
        export TBLIS_DIR="$HOME/tblis_install"
        export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
        
        # Kompilasi dan buang output ke direktori release/
        python -m build --wheel --no-isolation --outdir release
        ccache -s

    # =========================================================================
    # 6. UPLOAD WHEEL KE GITHUB RELEASES
    # =========================================================================
    - name: Create or Update Release and Upload Wheel
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0.3-nightly"
        name: "MSHQC 1.0.3 (AOT Build)"
        body: "Automated build of MSHQC natively compiled without MLIR/JIT dependency."
        files: release/*.whl
        prerelease: true
      env:
        # Token tidak perlu disuntikkan secara eksplisit, GITHUB_TOKEN ephemeral akan otomatis digunakan.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # =========================================================================
    # 7. EXPOSE ARTIFACT DIRECTORY KE GITHUB ACTIONS UI
    # =========================================================================
    - name: Expose Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mshqc-release-binaries
        path: release/
        retention-days: 7