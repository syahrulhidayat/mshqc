name: Compile and Release Wheel to Public Repo

on:
  push:
    branches: [ "main", "master", "debug5", "build-pypi" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels on ubuntu-latest (manylinux)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.17.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          
          # Kita hanya membangun untuk versi 3.11 sampai 3.14 x86_64
          CIBW_BUILD: "cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
          CIBW_PRERELEASE_PYTHONS: 1
          
          # =========================================================================
          # STATIC COMPILATION DI DALAM DOCKER MANYLINUX
          # =========================================================================
          CIBW_BEFORE_ALL: >
            dnf install -y dnf-plugins-core epel-release &&
            dnf config-manager --set-enabled crb &&
            dnf install -y git wget hdf5-devel ninja-build &&
            git clone --depth 1 -b v6.1.2 https://github.com/sunqm/libcint.git /tmp/libcint &&
            cd /tmp/libcint && mkdir build && cd build &&
            cmake -DCMAKE_INSTALL_PREFIX=/usr/local -DENABLE_EXAMPLE=0 -DENABLE_TEST=0 -DBUILD_SHARED_LIBS=OFF .. &&
            make -j$(nproc) && make install &&
            git clone --depth 1 -b v1.2.0 https://github.com/devinamatthews/tblis.git /tmp/tblis &&
            cd /tmp/tblis && git submodule update --init --recursive &&
            sed -i 's/SIGSTKSZ/8192/g' src/external/catch/catch.hpp &&
            sed -i '1i #include <limits>' src/external/marray/include/short_vector.hpp &&
            sed -i '1i #include <limits>' src/external/marray/include/range.hpp &&
            sed -i '1i #include <limits>' src/util/thread.h &&
            ./configure --prefix=/usr/local --enable-static --disable-shared --without-hwloc --enable-config=haswell,zen,core2,sandybridge,bulldozer,piledriver,excavator,reference &&
            make -j$(nproc) && make install

          CIBW_BEFORE_BUILD: >
            pip install mkl mkl-devel mkl-include cmake ninja pytest numpy scipy
          
          # CXXFLAGS dll mengarah ke /usr/local tempat libcint dan tblis hasil compile di atas berada
          CIBW_ENVIRONMENT: >
            CXXFLAGS="-std=c++20 -fopenmp -O3 -DNDEBUG -mavx2 -mfma -mno-avx512f -funroll-loops -ftree-vectorize -mtune=generic -fno-math-errno -DEIGEN_USE_MKL_ALL -I/usr/local/include"
            CFLAGS="-O3 -DNDEBUG"
            CMAKE_BUILD_TYPE=Release
            LDFLAGS="-L/usr/local/lib -L/usr/local/lib64 -lquadmath"
            CMAKE_PREFIX_PATH="/usr/local"
            TBLIS_DIR="/usr/local"
            CMAKE_BUILD_PARALLEL_LEVEL=4
          
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest {project}/tests/ -v"

      - name: Upload Wheels as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/build-pypi' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}