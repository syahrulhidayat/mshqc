name: Compile, Test, and Release Wheel to Public Repo

on:
  push:
    branches: [ "mshqc-1.0.2" ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: self-hosted
    steps:
    - name: Checkout Private Source Code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.MY_GITHUB_TOKEN }} 
        fetch-depth: 0 


    - name: Activate Local Environment & Verify Dependencies
      shell: bash
      run: |
        source $HOME/miniconda3/etc/profile.d/conda.sh
        conda activate mshqc_314
        
        conda install -y -c conda-forge cmake make compilers eigen pkg-config "hdf5=1.14.3" pip liblapacke mkl mkl-devel mkl-include llvmdev mlir
        python -m pip install build wheel nanobind setuptools


    - name: Ensure libcint is Compiled
      shell: bash
      run: |
        if [ -d "$HOME/libcint_install/lib64" ] || [ -d "$HOME/libcint_install/lib" ]; then
          echo "✅ libcint sudah terinstal di PC. Melanjutkan..."
        else
          echo "⚠️ libcint tidak ditemukan. Mengompilasi dari Source..."
          rm -rf /tmp/libcint 
          
          git clone -b v6.1.2 https://github.com/sunqm/libcint.git /tmp/libcint
          cd /tmp/libcint && mkdir build && cd build
          
          export CFLAGS="-O3 -fPIC -mavx2 -mfma -mno-avx512f -funroll-loops -fno-math-errno -Wno-incompatible-pointer-types -std=gnu17"
          export CXXFLAGS="-O3 -fPIC -mavx2 -mfma -mno-avx512f -funroll-loops -fno-math-errno -Wno-incompatible-pointer-types -std=gnu++17"

          cmake -DCMAKE_INSTALL_PREFIX=$HOME/libcint_install \
                -DCMAKE_C_FLAGS="$CFLAGS" -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
                -DENABLE_EXAMPLE=0 -DENABLE_TEST=0 -DBUILD_SHARED_LIBS=OFF ..
          
          make -j $(nproc) && make install
        fi

    - name: Ensure TBLIS is Compiled
      shell: bash
      run: |
        if [ -d "$HOME/tblis_install/lib64" ] || [ -d "$HOME/tblis_install/lib" ]; then
          echo "✅ TBLIS sudah terinstal di PC. Melanjutkan..."
        else
          echo "⚠️ TBLIS tidak ditemukan. Mengompilasi dari Source..."
          rm -rf /tmp/tblis 
          
          git clone -b v1.2.0 https://github.com/devinamatthews/tblis.git /tmp/tblis
          cd /tmp/tblis && git submodule update --init --recursive
          
          sed -i 's/SIGSTKSZ/8192/g' src/external/catch/catch.hpp
          sed -i '1i #include <limits>' src/external/marray/include/short_vector.hpp
          sed -i '1i #include <limits>' src/external/marray/include/range.hpp
          sed -i '1i #include <limits>' src/util/thread.h
          
          export CFLAGS="-O3 -fPIC -mno-avx512f -mno-avx512vl -mno-avx512dq -mno-avx512bw -mno-avx512cd -Wno-incompatible-pointer-types -std=gnu17"
          export CXXFLAGS="-O3 -fPIC -mno-avx512f -mno-avx512vl -mno-avx512dq -mno-avx512bw -mno-avx512cd -Wno-incompatible-pointer-types -std=gnu++17"

          ./configure --prefix=$HOME/tblis_install --enable-static --disable-shared --without-hwloc --enable-config=haswell,zen,core2,sandybridge,bulldozer,piledriver,excavator,reference CXXFLAGS="$CXXFLAGS" CFLAGS="$CFLAGS"
                      
          make -j $(nproc) && make install
        fi

    - name: Compile MSHQC C++ Backend & Compiler
      shell: bash
      run: |
        source $HOME/miniconda3/etc/profile.d/conda.sh
        conda activate mshqc_314
        rm -rf dist/ *.egg-info build/lib.* build/temp.* python/mshqc/*.so

        export CC="ccache $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc"
        export CXX="ccache $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++" 
        export CXXFLAGS="-std=c++17 -fopenmp -O3 -mavx2 -mfma -mno-avx512f -mtune=generic -DEIGEN_USE_MKL_ALL -DNDEBUG -I$HOME/tblis_install/include -I$HOME/libcint_install/include -I$CONDA_PREFIX/include"
        export LDFLAGS="-lquadmath"   
        export CMAKE_PREFIX_PATH=$HOME/libcint_install:$HOME/tblis_install:$CONDA_PREFIX
        export CMAKE_ARGS="-DLLVM_DIR=$CONDA_PREFIX/lib/cmake/llvm -DMLIR_DIR=$CONDA_PREFIX/lib/cmake/mlir"
        
        python setup.py build_ext -j $(nproc)

    - name: Build Python Wheel (.whl)
      shell: bash
      run: |
        source $HOME/miniconda3/etc/profile.d/conda.sh
        conda activate mshqc_314
        export CMAKE_ARGS="-DLLVM_DIR=$CONDA_PREFIX/lib/cmake/llvm -DMLIR_DIR=$CONDA_PREFIX/lib/cmake/mlir"
        
        python setup.py bdist_wheel


    - name: Install Wheel & Execute GDB Telemetry
      id: test_phase
      shell: bash
      run: |
        source $HOME/miniconda3/etc/profile.d/conda.sh
        conda activate mshqc_314

        python -m pip uninstall -y mshqc
        python -m pip install dist/*.whl

        mkdir -p test_logs
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        LOG_FILE="test_logs/gdb_telemetry_${TIMESTAMP}.log"

        echo "======================================================================="
        echo " MENGEKSEKUSI PENGUJIAN GDB BATCH MODE"
        echo "======================================================================="

        set +e
        set +o pipefail
        
        gdb -return-child-result --batch \
            -ex "run" \
            -ex "echo \n--- FATAL MEMORY CRASH DETECTED ---\n" \
            -ex "bt full" \
            -ex "frame 0" \
            -ex "info frame" \
            -ex "x/10i \$rip" \
            -ex "quit" \
            --args python test/test_mp2_mshqc_soscf2.py | tee $LOG_FILE
            
        EXIT_CODE=${PIPESTATUS[0]}
        
        # Aktifkan kembali proteksi bash
        set -e
        set -o pipefail
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "❌ Pengujian MP2 gagal dengan Exit Code $EXIT_CODE."
          exit 1
        else
          echo "✅ Pengujian MP2 sukses."
        fi


    
    # =========================================================================
    # 6. INSTALASI DAN PENGUJIAN JIT MLIR VIA GDB TELEMETRY (ITERATIF)
    # =========================================================================
    - name: Install Wheel & Execute GDB Telemetry
      shell: bash
      run: |
        source $HOME/miniconda3/etc/profile.d/conda.sh
        conda activate mshqc_314

        python -m pip uninstall -y mshqc
        python -m pip install dist/*.whl

        mkdir -p test_logs
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)

        echo "======================================================================="
        echo " MENGEKSEKUSI PENGUJIAN GDB BATCH MODE PADA DIREKTORI tests/"
        echo "======================================================================="

        set +e
        set +o pipefail

        for TEST_FILE in tests/*.py; do
            echo "--- Menguji: $TEST_FILE ---"
            BASENAME=$(basename "$TEST_FILE" .py)
            LOG_FILE="test_logs/gdb_telemetry_${BASENAME}_${TIMESTAMP}.log"
            
            gdb -return-child-result --batch \
                -ex "run" \
                -ex "echo \n--- FATAL MEMORY CRASH DETECTED ---\n" \
                -ex "bt full" \
                -ex "frame 0" \
                -ex "info frame" \
                -ex "x/10i \$rip" \
                -ex "quit" \
                --args python "$TEST_FILE" | tee "$LOG_FILE"
                
            EXIT_CODE=${PIPESTATUS[0]}
            
            if [ $EXIT_CODE -ne 0 ]; then
              echo "❌ Pengujian $TEST_FILE gagal dengan Exit Code $EXIT_CODE."
              # Aktifkan kembali proteksi bash sebelum melakukan abort
              set -e
              set -o pipefail
              exit 1
            else
              echo "✅ Pengujian $TEST_FILE sukses."
            fi
        done

        # Aktifkan kembali proteksi bash setelah loop selesai
        set -e
        set -o pipefail