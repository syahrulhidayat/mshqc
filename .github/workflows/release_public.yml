name: Compile and Release Wheel to Public Repo

on:
  push:
    branches: [ "lembaran-baru" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Private Source Code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.MY_GITHUB_TOKEN }} 
        fetch-depth: 0 

    # =========================================================================
    # 1. SETUP CONDA (Dilakukan awal agar kita bisa pakai compilernya)
    # =========================================================================
    - name: Setup Conda Environment (Python 3.12)
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: "3.12"
        channels: conda-forge
        use-only-tar-bz2: false 

    - name: Install Build Dependencies
      shell: bash -el {0}
      run: |
        # PERHATIAN: 'tblis' dihapus dari sini agar kita menggunakan versi kustom
        conda install -y -c conda-forge cmake make compilers eigen pkg-config "hdf5=1.14.3" pip libcint liblapacke openblas
        python -m pip install build wheel nanobind

    # =========================================================================
    # 2. CACHE & COMPILE TBLIS (Hanya jika belum ada di Cache)
    # =========================================================================
    - name: Cache Custom TBLIS
      id: cache-tblis
      uses: actions/cache@v3
      with:
        path: ~/tblis_install
        key: tblis-v1.2.0-static-avx2-fpic-v2

    - name: Compile TBLIS (Static + Safe AVX2)
      if: steps.cache-tblis.outputs.cache-hit != 'true'
      shell: bash -el {0}
      run: |
        echo "Cache TBLIS tidak ditemukan. Mengompilasi dari Source..."
        git clone -b v1.2.0 https://github.com/devinamatthews/tblis.git /tmp/tblis
        cd /tmp/tblis
        git submodule update --init --recursive
        
        # ====================================================================
        # [PATCH KOMPATIBILITAS GCC 14]: Menambal bug TBLIS lama secara instan
        # ====================================================================
        # 1. Ganti SIGSTKSZ dinamis menjadi ukuran statis
        sed -i 's/SIGSTKSZ/8192/g' src/external/catch/catch.hpp
        # 2. Tambahkan header <limits> yang diwajibkan oleh compiler baru
        sed -i '1i #include <limits>' src/external/marray/include/short_vector.hpp
        sed -i '1i #include <limits>' src/external/marray/include/range.hpp
        sed -i '1i #include <limits>' src/util/thread.h
        
        # Biarkan TBLIS menggunakan default intrinsics per kernel.
        export CFLAGS="-O3 -fPIC"
        export CXXFLAGS="-O3 -fPIC"

        # Menghapus flag yang tidak dikenali (--disable-config-knl, dsb)
        ./configure --prefix=$HOME/tblis_install \
                    --enable-static --disable-shared \
                    --without-hwloc \
                    CXXFLAGS="$CXXFLAGS" \
                    CFLAGS="$CFLAGS"
                    
        make -j 4
        make install
    # =========================================================================
    # 3. CCACHE & BUILD MSHQC WHEEL
    # =========================================================================
    - name: Setup Compiler Cache (ccache)
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-mshqc-ccache
        max-size: 500M

    - name: Build Python Wheel (.whl)
      shell: bash -el {0}
      run: |
        export CC="ccache $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc"
        export CXX="ccache $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++"
        export CXXFLAGS="-std=c++17 -fopenmp -O3 -mavx2 -mfma -mtune=generic -DEIGEN_USE_BLAS -DEIGEN_USE_LAPACKE -DNDEBUG -I$HOME/tblis_install/include"
        export CMAKE_PREFIX_PATH=$HOME/tblis_install:$CONDA_PREFIX
        export TBLIS_DIR=$HOME/tblis_install
        
        python setup.py bdist_wheel
        ccache -s

    # =========================================================================
    # 4. COMMIT KEMBALI KE REPO PRIVAT
    # =========================================================================
    - name: Commit and Push Wheel to Private Repo
      shell: bash -el {0}
      run: |
        git config --global user.name "MSHQC Automation"
        git config --global user.email "automation@mshqc.internal"
        
        mkdir -p releases
        rm -f releases/*.whl
        
        cp dist/*.whl releases/
        
        git add releases/*.whl
        
        if git diff-index --quiet HEAD --; then
          echo "Tidak ada perubahan biner baru untuk disimpan di repo privat."
        else
          git commit -m "CI-Bot: Update biner terkompilasi (.whl) [skip ci]"
          git push origin lembaran-baru
        fi

    # =========================================================================
    # 5. DEPLOY KE REPO PUBLIK
    # =========================================================================
    - name: Deploy Wheel to Public Repository (Closed-Source Mode)
      shell: bash -el {0}
      env:
        API_TOKEN_GITHUB: ${{ secrets.MY_GITHUB_TOKEN }} 
      run: |
        git config --global user.name "MSHQC Automation"
        git config --global user.email "automation@mshqc.internal"

        git clone https://x-access-token:${API_TOKEN_GITHUB}@github.com/mshqc/mshqc-public.git public_repo

        mkdir -p public_repo/releases
        rm -f public_repo/releases/*.whl
        
        cp dist/*.whl public_repo/releases/ 2>/dev/null || true
        cp -r data public_repo/ 2>/dev/null || true

        cd public_repo
        git add -A
        
        if git diff-index --quiet HEAD --; then
          echo "Tidak ada pembaruan pada biner mshqc."
        else
          git commit -m "Auto-Deploy: Rilis MSHQC Wheel (.whl) Aman"
          git push origin main
        fi
