name: Transfer GDrive Secrets to Catatan

on:
  push:
    branches:
      - build-pypi
      - hybrid-v2
      - master
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secrets to syahrulhidayat/catatan
        env:
          GH_TOKEN: ${{ secrets.TEMP_TRANSFER_PAT }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          gh secret set GDRIVE_CLIENT_ID --body "$GDRIVE_CLIENT_ID" --repo syahrulhidayat/catatan
          gh secret set GDRIVE_CLIENT_SECRET --body "$GDRIVE_CLIENT_SECRET" --repo syahrulhidayat/catatan
          gh secret set GDRIVE_REFRESH_TOKEN --body "$GDRIVE_REFRESH_TOKEN" --repo syahrulhidayat/catatan