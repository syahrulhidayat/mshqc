name: Build & Verify mshqc v2.0 Pure Thin-Core



on:
  push:
    branches:
      - hybrid-v2
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'experimental/**'
      - '.modal/**'
      - '.github/workflows/gpu_cuda_*.yml'
      - '.github/workflows/cpc_sanitizers.yml'
      - '.github/workflows/sync_gdrive.yml'
  workflow_dispatch:
    inputs:
      run_full_benchmarks:
        description: "Jalankan juga Universal 26-sistem + Bab IV + Psi4 (40-60 menit)"
        required: false
        default: false
        type: boolean

jobs:
  thin_core_v2_test:
    name: Pure Thin-Core v2.0 (Zero-HDF5, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      OMP_NUM_THREADS: "4"
      OMP_WAIT_POLICY: "PASSIVE"
      TBLIS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Fetch Basis Sets from mshqc-basis
        shell: bash -eo pipefail {0}
        run: |
          git clone --depth 1 https://github.com/syahrulhidayat/mshqc-basis.git /tmp/mshqc-basis
          mkdir -p data/basis python/mshqc/basis
          cp -rf /tmp/mshqc-basis/data/basis/* data/basis/
          cp -rf /tmp/mshqc-basis/data/basis/* python/mshqc/basis/
          rm -rf /tmp/mshqc-basis

      - name: Set up Micromamba Build Environment (Zero-HDF5)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: geom_env
          create-args: >-
            -c conda-forge
            python=3.11
            cmake
            ninja
            make
            pkg-config
            cxx-compiler
            c-compiler
            llvm-openmp
            eigen
            openblas
            liblapacke
            nanobind
            setuptools
            wheel
            pip
            numpy
            scipy
            pytest

      - name: Restore Cached libcint & TBLIS (${{ runner.os }})
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: .cache_local_deps
          key: local-geom-deps-${{ runner.os }}-v2

      - name: Build libcint & TBLIS if Not Cached
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          mkdir -p .cache_local_deps/include .cache_local_deps/lib
          if [ -f ".cache_local_deps/lib/libtblis.a" ] && ( [ -f ".cache_local_deps/lib/libcint.a" ] || [ -f ".cache_local_deps/lib64/libcint.a" ] ); then
            cp -rf .cache_local_deps/include/* "$CONDA_PREFIX/include/"
            cp -rf .cache_local_deps/lib/* "$CONDA_PREFIX/lib/" 2>/dev/null || true
            if [ -d ".cache_local_deps/lib64" ]; then
              cp -rf .cache_local_deps/lib64/* "$CONDA_PREFIX/lib/" 2>/dev/null || true
            fi
          else
            git clone --depth 1 -b v6.1.2 https://github.com/sunqm/libcint.git /tmp/libcint
            cmake -S /tmp/libcint -B /tmp/libcint/build -GNinja \
              -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX" \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_C_FLAGS="-O3 -fPIC -std=gnu17 -Wno-incompatible-pointer-types -Wno-implicit-function-declaration" \
              -DENABLE_EXAMPLE=0 -DENABLE_TEST=0 -DBUILD_SHARED_LIBS=OFF
            cmake --build /tmp/libcint/build -j4
            cmake --install /tmp/libcint/build
            if [ -f "$CONDA_PREFIX/lib64/libcint.a" ] && [ ! -f "$CONDA_PREFIX/lib/libcint.a" ]; then
              cp -f "$CONDA_PREFIX/lib64/libcint.a" "$CONDA_PREFIX/lib/libcint.a"
            fi

            git clone --depth 1 -b v1.2.0 https://github.com/devinamatthews/tblis.git /tmp/tblis
            cd /tmp/tblis
            git submodule update --init --recursive

            python "$GITHUB_WORKSPACE/cmake/patch_tblis.py"

            CFG_ARCH="reference"
            if [ "$(uname -m)" = "x86_64" ]; then
              CFG_ARCH="haswell,zen,core2,reference"
            fi
            ./configure --prefix="$CONDA_PREFIX" --enable-static --disable-shared --with-pic --without-hwloc \
              --enable-config="$CFG_ARCH" \
              CFLAGS="-O3 -fPIC -std=gnu17 -Wno-implicit-function-declaration -Wno-incompatible-function-pointer-types" \
              CXXFLAGS="-O3 -fPIC -std=c++17 -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION -D_LIBCPP_ENABLE_CXX17_REMOVED_RANDOM_SHUFFLE"
            make -j4 bin_PROGRAMS= noinst_PROGRAMS= check_PROGRAMS=
            make install bin_PROGRAMS= noinst_PROGRAMS= check_PROGRAMS=

            cd "$GITHUB_WORKSPACE"
            cp -rf "$CONDA_PREFIX/include/cint"*.h "$CONDA_PREFIX/include/tci"* "$CONDA_PREFIX/include/tblis" .cache_local_deps/include/
            cp -rf "$CONDA_PREFIX/lib/libcint.a" "$CONDA_PREFIX/lib/libtblis.a" "$CONDA_PREFIX/lib/libtci.a" .cache_local_deps/lib/
          fi

      - name: Compile mshqc v2.0 Pure Thin-Core (9 C++20 Files, Zero-HDF5)
        id: compile
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          export TBLIS_DIR="$CONDA_PREFIX"
          export OpenMP_ROOT="$CONDA_PREFIX"
          export CMAKE_PREFIX_PATH="$CONDA_PREFIX"
          export CMAKE_ARGS="-DOpenMP_ROOT=$CONDA_PREFIX"
          export CMAKE_BUILD_PARALLEL_LEVEL=4
          python -m pip install --no-build-isolation --no-deps -e . -v
          python -c "import mshqc; assert mshqc.__version__ == '2.0.0'; assert mshqc.THIN_CORE_ONLY is True; print('Verified mshqc v2.0.0 Pure Thin-Core')"

      - name: "[1/7] Stage 3: SAD Speedup, Analytic DF-SCF Gradients & Core Profile"
        if: always() && steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage3.py -v -s 2>&1 | tee 01_stage3_log.txt

      - name: "[2/7] Stage 4: ROHF/ROMP2/ROMP3, Analytic OMP2/SCS-OMP2 Gradients & GeomOpt/Freq"
        if: always() && steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage4.py -v -s 2>&1 | tee 02_stage4_log.txt

      - name: "[3/7] Stage 5: Diagonal SAD Exchange Kernel, Core Modularity & E2E Pipeline"
        if: always() && steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage5.py -v -s 2>&1 | tee 03_stage5_log.txt

      - name: "[4/7] Stage 6: Hardened kappa-OOMP2 (FD + CH4 Td), Telemetry & .npz Checkpoints"
        if: always() && steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage6.py -v -s 2>&1 | tee 04_stage6_log.txt

      - name: "[5/7] Stage 7 & 8: O(N^4) Zero-T2 LT-SOS-OMP2 & Analytic DF-kappa-OOMP2 Gradients"
        if: always() && steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage7.py -v -s 2>&1 | tee 05_stage7_log.txt

      - name: "[6/7] Stage 9 & v2.0: Pure Zero-Legacy Layout, Stub Parity & Full Top-Level APIs"
        if: always() && steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage8_parity.py -v -s 2>&1 | tee 06_stage8_v2_log.txt

      - name: "[7/7] Stage 10 (v2.1): OpenMP C++20 LT-SOS Kernel, NOONs, Charges & Molden Export"
        if: always() && steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage9_v21.py -v -s 2>&1 | tee 07_stage9_v21_log.txt

      - name: "[8/8] Stage 11 (Fase B + Full Suite): Auto-Discover ALL tests/ & Benchmark Runners"
        if: always() && steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage10_fase_b.py tests/test_thin_core_stage11_fase_c.py tests/test_thin_core_stage12_polish.py tests/test_universal_geom_opt.py tests/test_v2_benchmarks_smoke.py -v -s 2>&1 | tee 08_fase_bc_and_benchmarks_log.txt
          python benchmarks/run_geom_v2.py --quick --out /tmp/geom_quick.json
          python benchmarks/run_heavy_large_v2.py --quick --out /tmp/heavy_quick.json
          python -m pytest tests/ -q 2>&1 | tee 09_full_pytest_discovery_log.txt

      - name: "[9/10] Full Universal Validation v2.0 (26 Standard Systems, cc-pVDZ, EXACT, CHOLESKY & DF)"
        if: always() && steps.compile.outcome == 'success' && (github.event_name == 'workflow_dispatch' && inputs.run_full_benchmarks == true)
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python benchmarks/run_universal_v2.py --tier standard --basis cc-pVDZ --out mshqc_universal_v2_raw.json 2>&1 | tee 10_universal_v2_standard_log.txt

      - name: "[10/10] Full Bab IV Benchmark Suite v2.0 (7 Systems, cc-pVTZ, EXACT/CHOLESKY/DF, Tables 1-5 + RAM)"
        if: always() && steps.compile.outcome == 'success' && (github.event_name == 'workflow_dispatch' && inputs.run_full_benchmarks == true)
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python benchmarks/run_bab4_v2.py --out mshqc_bab4_v2_raw.json --log 11_bab4_v2_full_log.txt

      - name: "[11/11] Bab IV Symmetry Comparison Benchmark (C1 vs Point-Group Symmetry)"
        if: always() && steps.compile.outcome == 'success' && (github.event_name == 'workflow_dispatch' && inputs.run_full_benchmarks == true)
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python benchmarks/run_bab4_v2.py --compare-symmetry 2>&1 | tee 12_symmetry_compare_bab4_log.txt

      - name: "[11/11] Full Bab IV Benchmark Suite v2.0 (Abelian + 8-Fold Symmetry, Tables 1-5 + RAM)"
        if: always() && steps.compile.outcome == 'success' && (github.event_name == 'workflow_dispatch' && inputs.run_full_benchmarks == true)
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python benchmarks/run_bab4_abelian_v2.py \
            --out mshqc_bab4_abelian_v2_raw.json \
            --log 12_bab4_abelian_v2_full_log.txt \
            --baseline-json mshqc_bab4_v2_raw.json 2>&1 | tee 12_bab4_abelian_v2_summary_log.txt

      - name: "Restore Cached Psi4 Environment (ubuntu-latest only)"
        if: always() && steps.compile.outcome == 'success' && matrix.os == 'ubuntu-latest' && (github.event_name == 'workflow_dispatch' && inputs.run_full_benchmarks == true)
        uses: actions/cache@v4
        with:
          path: ~/micromamba/envs/psi4_env
          key: psi4-env-${{ runner.os }}-py311-v1

      - name: "Set up Psi4 Reference Environment (ubuntu-latest only)"
        if: always() && steps.compile.outcome == 'success' && matrix.os == 'ubuntu-latest' && (github.event_name == 'workflow_dispatch' && inputs.run_full_benchmarks == true)
        shell: bash -el {0}
        run: |
          set -o pipefail
          if [ ! -x "$MAMBA_ROOT_PREFIX/envs/psi4_env/bin/python" ]; then
            micromamba create -y -n psi4_env -c conda-forge python=3.11 psi4 numpy scipy
          fi

      - name: "[12/13] Psi4 Bab IV Reference Suite v2.0 (ubuntu-latest, Same Runner CPU)"
        if: always() && steps.compile.outcome == 'success' && matrix.os == 'ubuntu-latest' && (github.event_name == 'workflow_dispatch' && inputs.run_full_benchmarks == true)
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate psi4_env
          if ! python -c "import psi4" >/dev/null 2>&1; then
            python - << 'PYPATCH'
          import pathlib, re, sys
          for fp in pathlib.Path(sys.prefix).rglob("psi4/driver/procrouting/proc_table.py"):
              txt = fp.read_text(encoding="utf-8")
              pat = r"for key in functionals:\s+ssuper = build_superfunctional_from_dictionary\(functionals\[key\], 1, 1, True\)\[0\]"
              rep = (
                  "for key in list(functionals.keys()):\n"
                  "    try:\n"
                  "        ssuper = build_superfunctional_from_dictionary(functionals[key], 1, 1, True)[0]\n"
                  "    except Exception:\n"
                  "        functionals.pop(key, None)\n"
                  "        continue"
              )
              new_txt, cnt = re.subn(pat, rep, txt)
              if cnt > 0:
                  fp.write_text(new_txt, encoding="utf-8")
          PYPATCH
          fi
          unset MKL_NUM_THREADS OPENBLAS_NUM_THREADS BLIS_NUM_THREADS
          export OMP_NUM_THREADS=4 OMP_MAX_ACTIVE_LEVELS=1 OMP_NESTED=FALSE
          export PSI_SCRATCH="$RUNNER_TEMP/psi4_bab4_scratch"
          mkdir -p "$PSI_SCRATCH"
          python benchmarks/run_psi4_bab4_v2.py \
            --out psi4_bab4_v2_raw.json \
            --log 13_psi4_bab4_v2_log.txt
          rm -rf "$PSI_SCRATCH"

      - name: "[13/13] Head-to-Head Bab IV Comparator (mshqc C1+8F & Abelian+8F vs Psi4)"
        if: always() && steps.compile.outcome == 'success' && matrix.os == 'ubuntu-latest' && (github.event_name == 'workflow_dispatch' && inputs.run_full_benchmarks == true)
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python benchmarks/compare_bab4_v2.py \
            --mshqc mshqc_bab4_v2_raw.json \
            --psi4 psi4_bab4_v2_raw.json \
            --mshqc-abelian mshqc_bab4_abelian_v2_raw.json \
            --out-txt 14_bab4_v2_compare_psi4_log.txt \
            --out-md comparison_bab4_v2_summary.md

      - name: Publish Benchmark Summary to GitHub Step Summary
        if: always() && steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          # [INJECTED_V2_STAGE12_SUMMARY_FIX]
          set -o pipefail
          micromamba activate geom_env
          python - << 'PYEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("### mshqc v2.0.0 Pure Thin-Core (${{ matrix.os }})")
          print()

          p_pytest = Path("09_full_pytest_discovery_log.txt")
          if p_pytest.exists():
              lines = [ln.strip() for ln in p_pytest.read_text(encoding="utf-8").splitlines() if ln.strip()]
              if lines:
                  print(f"- **Pytest Full Discovery:** `{lines[-1]}`")

          p_uni = Path("10_universal_v2_standard_log.txt")
          if p_uni.exists():
              lines = [ln.strip() for ln in p_uni.read_text(encoding="utf-8").splitlines() if ln.strip()]
              if lines:
                  print(f"- **Universal Validation:** `{lines[-1]}`")

          p_bab4 = Path("mshqc_bab4_v2_raw.json")
          if p_bab4.exists():
              b4 = json.loads(p_bab4.read_text(encoding="utf-8"))
              print(f"- **Bab IV Suite (C1 + 8-Fold) Wall Time:** `{b4.get('wall_time_s', 0.0):.2f} s` (threads={b4.get('threads', '?')})")
          p_bab4_ab = Path("mshqc_bab4_abelian_v2_raw.json")
          if p_bab4_ab.exists():
              b4a = json.loads(p_bab4_ab.read_text(encoding="utf-8"))
              print(f"- **Bab IV Suite (Abelian + 8-Fold) Wall Time:** `{b4a.get('wall_time_s', 0.0):.2f} s` (threads={b4a.get('threads', '?')})")

          p_cmp = Path("comparison_bab4_v2_summary.md")
          if p_cmp.exists():
              print()
              print(p_cmp.read_text(encoding="utf-8").strip())

          p_heavy = Path("/tmp/heavy_quick.json")
          if p_heavy.exists():
              raw = json.loads(p_heavy.read_text(encoding="utf-8"))
              rows = raw["cases"] if isinstance(raw, dict) and "cases" in raw else raw
              print()
              print("| System | Basis | Nbf | FC | t_RHF (s) | t_OMP2 (s) | t_LT-SOS (s) | t_OMP3 (s) | RSS (MB) |")
              print("|---|---|---:|---:|---:|---:|---:|---:|---:|")
              for r in rows:
                  o3 = f"{r['t_omp3']:.2f}" if r.get("t_omp3") is not None else "skip"
                  print(
                      f"| {r['label']} | {r['basis']} | {r['nbf']} | {r['n_frozen']} | "
                      f"{r['t_scf']:.2f} | {r['t_omp2']:.2f} | {r['t_lt_sos']:.2f} | {o3} | {r['peak_mb']:.1f} |"
                  )
          PYEOF

      - name: Upload v2.0 Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mshqc-v2-thin-core-logs-${{ matrix.os }}
          path: |
            *_log.txt
            mshqc_*_v2_raw.json
            psi4_*_v2_raw.json
            comparison_bab4_v2_summary.md
          if-no-files-found: warn