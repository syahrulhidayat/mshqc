name: Compile Locally and Run Hybrid Phase 1 Test (mshqc)

on:
  push:
    branches:
      - build-pypi
      - test-geom
      - test
      - hybrid-v2
  workflow_dispatch:

jobs:
  hybrid_phase1_test:
    name: Local Build & Hybrid Phase 1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      OMP_NUM_THREADS: "4"
      OMP_WAIT_POLICY: "PASSIVE"
      TBLIS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HDF5_USE_FILE_LOCKING: "FALSE"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Fetch Basis Sets from mshqc-basis
        shell: bash -eo pipefail {0}
        run: |
          git clone --depth 1 https://github.com/syahrulhidayat/mshqc-basis.git /tmp/mshqc-basis
          mkdir -p data/basis python/mshqc/basis
          cp -rf /tmp/mshqc-basis/data/basis/* data/basis/
          cp -rf /tmp/mshqc-basis/data/basis/* python/mshqc/basis/
          rm -rf /tmp/mshqc-basis

      - name: Set up Micromamba Build Environment for mshqc (geom_env)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: geom_env
          create-args: >-
            -c conda-forge
            python=3.11
            cmake
            ninja
            make
            pkg-config
            cxx-compiler
            c-compiler
            llvm-openmp
            eigen
            hdf5=1.14.3
            openblas
            liblapacke
            nanobind
            setuptools
            wheel
            pip
            numpy
            scipy
            pytest

      - name: Restore Cached libcint & TBLIS (${{ runner.os }})
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: .cache_local_deps
          key: local-geom-deps-${{ runner.os }}-v2

      - name: Build libcint & TBLIS if Not Cached
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          mkdir -p .cache_local_deps/include .cache_local_deps/lib
          if [ -f ".cache_local_deps/lib/libtblis.a" ] && ( [ -f ".cache_local_deps/lib/libcint.a" ] || [ -f ".cache_local_deps/lib64/libcint.a" ] ); then
            cp -rf .cache_local_deps/include/* "$CONDA_PREFIX/include/"
            cp -rf .cache_local_deps/lib/* "$CONDA_PREFIX/lib/" 2>/dev/null || true
            if [ -d ".cache_local_deps/lib64" ]; then
              cp -rf .cache_local_deps/lib64/* "$CONDA_PREFIX/lib/" 2>/dev/null || true
            fi
          else
            git clone --depth 1 -b v6.1.2 https://github.com/sunqm/libcint.git /tmp/libcint
            cmake -S /tmp/libcint -B /tmp/libcint/build -GNinja \
              -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX" \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_C_FLAGS="-O3 -fPIC -std=gnu17 -Wno-incompatible-pointer-types -Wno-implicit-function-declaration" \
              -DENABLE_EXAMPLE=0 -DENABLE_TEST=0 -DBUILD_SHARED_LIBS=OFF
            cmake --build /tmp/libcint/build -j4
            cmake --install /tmp/libcint/build
            if [ -f "$CONDA_PREFIX/lib64/libcint.a" ] && [ ! -f "$CONDA_PREFIX/lib/libcint.a" ]; then
              cp -f "$CONDA_PREFIX/lib64/libcint.a" "$CONDA_PREFIX/lib/libcint.a"
            fi

            git clone --depth 1 -b v1.2.0 https://github.com/devinamatthews/tblis.git /tmp/tblis
            cd /tmp/tblis
            git submodule update --init --recursive

            python - << 'EOF'
          import pathlib
          p = pathlib.Path('src/external/catch/catch.hpp')
          p.write_text(p.read_text().replace('SIGSTKSZ', '8192'))
          for f in ('src/external/marray/include/short_vector.hpp', 'src/external/marray/include/range.hpp', 'src/util/thread.h'):
              fp = pathlib.Path(f)
              fp.write_text('#include <limits>\n' + fp.read_text())
          tp = pathlib.Path('src/external/tci/tci/task_set.c')
          tp.write_text('#include <stdlib.h>\n' + tp.read_text())
          ep = pathlib.Path('src/external/marray/include/expression.hpp')
          ep.write_text(ep.read_text().replace(
              '#include <x86intrin.h>',
              '#if defined(__GNUC__) && (defined(__x86_64__) || defined(__i386__))\n#include <x86intrin.h>\n#else\n#undef __AVX512F__\n#undef __AVX__\n#undef __SSE2__\n#endif'
          ))
          cp = pathlib.Path('src/util/cpuid.hpp')
          if cp.exists():
              txt = cp.read_text()
              txt = txt.replace('enum {VENDOR_ARM, VENDOR_UNKNOWN}', 'enum {VENDOR_ARM, VENDOR_UNKNOWN};')
              txt = txt.replace('enum {MODEL_ARMV7, MODEL_ARMV8, MODEL_UNKNOWN}', 'enum {MODEL_ARMV7, MODEL_ARMV8, MODEL_UNKNOWN};')
              cp.write_text(txt)
          cx = pathlib.Path('src/util/cpuid.cxx')
          if cx.exists():
              cx.write_text(cx.read_text().replace('strtoi(ptno, pos, 16)', '((void)pos, (int)strtol(ptno.c_str(), NULL, 16))'))
          EOF

            CFG_ARCH="reference"
            if [ "$(uname -m)" = "x86_64" ]; then
              CFG_ARCH="haswell,zen,core2,reference"
            fi
            ./configure --prefix="$CONDA_PREFIX" --enable-static --disable-shared --with-pic --without-hwloc \
              --enable-config="$CFG_ARCH" \
              CFLAGS="-O3 -fPIC -std=gnu17 -Wno-implicit-function-declaration -Wno-incompatible-function-pointer-types" \
              CXXFLAGS="-O3 -fPIC -std=c++17 -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION -D_LIBCPP_ENABLE_CXX17_REMOVED_RANDOM_SHUFFLE"
            make -j4 bin_PROGRAMS= noinst_PROGRAMS= check_PROGRAMS=
            make install bin_PROGRAMS= noinst_PROGRAMS= check_PROGRAMS=

            cd "$GITHUB_WORKSPACE"
            cp -rf "$CONDA_PREFIX/include/cint"*.h "$CONDA_PREFIX/include/tci"* "$CONDA_PREFIX/include/tblis" .cache_local_deps/include/
            cp -rf "$CONDA_PREFIX/lib/libcint.a" "$CONDA_PREFIX/lib/libtblis.a" "$CONDA_PREFIX/lib/libtci.a" .cache_local_deps/lib/
          fi

      - name: Compile mshqc In-Place in geom_env
        id: compile
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          export TBLIS_DIR="$CONDA_PREFIX"
          export OpenMP_ROOT="$CONDA_PREFIX"
          export CMAKE_PREFIX_PATH="$CONDA_PREFIX"
          export CMAKE_ARGS="-DOpenMP_ROOT=$CONDA_PREFIX"
          export CMAKE_BUILD_PARALLEL_LEVEL=4
          python -m pip install --no-build-isolation --no-deps -e . -v
          python -c "import mshqc; print('Compiled mshqc version:', getattr(mshqc, '__version__', 'local-build'))"

      # =========================================================================
      # SINGLE TEST SUITE: HYBRID ARCHITECTURE PHASE 1-5 & THIN CORE STAGE 1-4
      # =========================================================================
      - name: "[01/09] Run Hybrid Phase 1 Verification (test_hybrid_phase1.py)"
        if: steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_hybrid_phase1.py -v -s 2>&1 | tee 01_test_hybrid_phase1_log.txt

      - name: "[02/09] Run Hybrid Phase 2 Verification (test_hybrid_phase2.py)"
        if: steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_hybrid_phase2.py -v -s 2>&1 | tee 02_test_hybrid_phase2_log.txt

      - name: "[03/09] Run Hybrid Phase 3 Verification (test_hybrid_phase3.py)"
        if: steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_hybrid_phase3.py -v -s 2>&1 | tee 03_test_hybrid_phase3_log.txt

      - name: "[04/09] Run Hybrid Phase 4 Verification (test_hybrid_phase4.py)"
        if: steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_hybrid_phase4.py -v -s 2>&1 | tee 04_test_hybrid_phase4_log.txt

      - name: "[05/09] Run Hybrid Phase 5 Verification (test_hybrid_phase5.py)"
        if: steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_hybrid_phase5.py -v -s 2>&1 | tee 05_test_hybrid_phase5_log.txt

      - name: "[06/09] Run Thin Core Stage 1 Verification (test_thin_core_stage1.py)"
        if: steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage1.py -v -s 2>&1 | tee 06_test_thin_core_stage1_log.txt

      - name: "[07/09] Run Thin Core Stage 2 Verification (test_thin_core_stage2.py)"
        if: steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage2.py -v -s 2>&1 | tee 07_test_thin_core_stage2_log.txt

      - name: "[08/09] Run Thin Core Stage 3 Verification (test_thin_core_stage3.py)"
        if: steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage3.py -v -s 2>&1 | tee 08_test_thin_core_stage3_log.txt

      - name: "[09/09] Run Thin Core Stage 4 Verification (test_thin_core_stage4.py)"
        if: steps.compile.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage4.py -v -s 2>&1 | tee 09_test_thin_core_stage4_log.txt

      # =========================================================================
      # UPLOAD ALL TEST LOGS AS SINGLE COMBINED ARTIFACT (.zip)
      # =========================================================================
      - name: Upload All Hybrid & Thin Core Test Logs (Combined ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mshqc-hybrid-test-logs-${{ matrix.os }}
          path: 0*_test_*_log.txt
          if-no-files-found: warn

  # [INJECTED_THIN_CORE_STAGE4_CI_JOB]
  thin_core_only_test:
    name: Thin-Core Only (-DMSHQC_THIN_CORE=ON, ${{ matrix.os }})
    needs: hybrid_phase1_test
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      OMP_NUM_THREADS: "4"
      OMP_WAIT_POLICY: "PASSIVE"
      TBLIS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HDF5_USE_FILE_LOCKING: "FALSE"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Fetch Basis Sets from mshqc-basis
        shell: bash -eo pipefail {0}
        run: |
          git clone --depth 1 https://github.com/syahrulhidayat/mshqc-basis.git /tmp/mshqc-basis
          mkdir -p data/basis python/mshqc/basis
          cp -rf /tmp/mshqc-basis/data/basis/* data/basis/
          cp -rf /tmp/mshqc-basis/data/basis/* python/mshqc/basis/
          rm -rf /tmp/mshqc-basis

      - name: Set up Micromamba Build Environment (geom_env)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: geom_env
          create-args: >-
            -c conda-forge
            python=3.11
            cmake
            ninja
            make
            pkg-config
            cxx-compiler
            c-compiler
            llvm-openmp
            eigen
            hdf5=1.14.3
            openblas
            liblapacke
            nanobind
            setuptools
            wheel
            pip
            numpy
            scipy
            pytest

      - name: Restore Cached libcint & TBLIS (${{ runner.os }})
        uses: actions/cache@v4
        with:
          path: .cache_local_deps
          key: local-geom-deps-${{ runner.os }}-v2

      - name: Install Cached libcint & TBLIS into geom_env
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          if [ -f ".cache_local_deps/lib/libtblis.a" ]; then
            cp -rf .cache_local_deps/include/* "$CONDA_PREFIX/include/"
            cp -rf .cache_local_deps/lib/* "$CONDA_PREFIX/lib/" 2>/dev/null || true
            if [ -d ".cache_local_deps/lib64" ]; then
              cp -rf .cache_local_deps/lib64/* "$CONDA_PREFIX/lib/" 2>/dev/null || true
            fi
          else
            echo "Cache miss for libcint/TBLIS; run full build job first to populate cache."
            exit 1
          fi

      - name: Compile Minimal C++20 Thin-Core (-DMSHQC_THIN_CORE=ON)
        id: compile_thin
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          export TBLIS_DIR="$CONDA_PREFIX"
          export OpenMP_ROOT="$CONDA_PREFIX"
          export CMAKE_PREFIX_PATH="$CONDA_PREFIX"
          export CMAKE_ARGS="-DOpenMP_ROOT=$CONDA_PREFIX -DMSHQC_THIN_CORE=ON"
          export CMAKE_BUILD_PARALLEL_LEVEL=4
          python -m pip install --no-build-isolation --no-deps -e . -v
          python -c "import mshqc; assert mshqc.THIN_CORE_ONLY is True; assert not hasattr(mshqc, 'RHF'); print('Verified THIN_CORE_ONLY=True')"

      - name: "[THIN-CORE 1/2] Run Stage 3 Verification (No Legacy C++)"
        if: steps.compile_thin.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage3.py -v -s 2>&1 | tee tc_01_stage3_log.txt

      - name: "[THIN-CORE 2/2] Run Stage 4 Verification (No Legacy C++)"
        if: steps.compile_thin.outcome == 'success'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate geom_env
          python -m pytest tests/test_thin_core_stage4.py -v -s 2>&1 | tee tc_02_stage4_log.txt

      - name: Upload Thin-Core Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mshqc-thin-core-only-logs-${{ matrix.os }}
          path: tc_*_log.txt
          if-no-files-found: warn