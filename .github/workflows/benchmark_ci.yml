name: Validation & Benchmark Suite (mshqc vs Psi4)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  apple_to_apple_benchmark:
    name: Run Pytest & Benchmark Suite (mshqc PyPI Wheel vs Psi4)
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "4"
      TBLIS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_MAX_ACTIVE_LEVELS: "1"
      HDF5_USE_FILE_LOCKING: "FALSE"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (for precompiled mshqc PyPI wheel)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Precompiled mshqc Wheel from PyPI (No C++ Recompile)
        run: |
          python3 -m venv /tmp/mshqc_venv
          /tmp/mshqc_venv/bin/pip install --upgrade pip
          /tmp/mshqc_venv/bin/pip uninstall -y mshqc || true
          /tmp/mshqc_venv/bin/pip install --no-cache-dir mshqc numpy scipy mkl pytest
          echo "LD_LIBRARY_PATH=/tmp/mshqc_venv/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Run Automated Pytest Validation Suite (tests/test_mshqc.py)
        run: |
          /tmp/mshqc_venv/bin/pytest tests/test_mshqc.py -v -s

      - name: Run Full 60-Run mshqc Benchmark (tests/test_mshqc2.py)
        run: |
          /tmp/mshqc_venv/bin/python -u tests/test_mshqc2.py | tee mshqc_bench.txt

      - name: Set up Micromamba & Install Psi4 (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: psi4_env
          create-args: >-
            -c conda-forge
            python=3.11
            psi4
            numpy
            scipy

      - name: Run Full 60-Run Psi4 Reference Benchmark (tests/benc.py)
        shell: bash -el {0}
        run: |
          micromamba activate psi4_env
          python -u tests/benc.py | tee psi4_bench.txt

      - name: Generate Head-to-Head Comparison Table (mshqc vs Psi4)
        run: |
          /tmp/mshqc_venv/bin/python tests/compare_mshqc_psi4.py mshqc_bench.txt psi4_bench.txt

      - name: Run Extra Chapter 4 Benchmarks (RAM, S2, FD Gradient)
        shell: bash -el {0}
        run: |
          export PSI4_PY=$(micromamba run -n psi4_env which python)
          export PSI4_PYTHON="$PSI4_PY"
          /tmp/mshqc_venv/bin/python -u tests/test_bab4_benchmark.py | tee test_bab4_benchmark.txt
          cp test_bab4_benchmark.txt bab4_extra_bench.txt

      - name: Run Universal Validation Suite (tests/test_universal_validation.py)
        shell: bash -el {0}
        run: |
          export PSI4_PY=$(micromamba run -n psi4_env which python)
          export PSI4_PYTHON="$PSI4_PY"
          /tmp/mshqc_venv/bin/python -u tests/test_universal_validation.py | tee test_universal_validation.txt

      - name: Upload Benchmark Logs & Comparison Table as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mshqc-vs-psi4-benchmark-results
          path: |
            mshqc_bench.txt
            psi4_bench.txt
            comparison_summary.md
            test_bab4_benchmark.txt
            bab4_extra_bench.txt
            test_universal_validation.txt