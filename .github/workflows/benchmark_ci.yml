name: Validation & Benchmark Suite (mshqc vs Psi4)

on:
  push:
    branches: [ "benchmark" ]
  workflow_dispatch:

jobs:
  apple_to_apple_benchmark:
    name: Build mshqc from Source & Run Benchmark Suite (mshqc vs Psi4)
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "4"
      TBLIS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      OMP_MAX_ACTIVE_LEVELS: "1"
      HDF5_USE_FILE_LOCKING: "FALSE"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Static C/C++ Dependencies (libcint & TBLIS)
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/mshqc_deps
          key: ubuntu-latest-deps-libcint-v6.1.2-tblis-v1.2.0-v2

      - name: Install System Libraries & Build libcint + TBLIS (if not cached)
        run: |
          mkdir -p ${{ github.workspace }}/scratch_tmp
          export TMPDIR="${{ github.workspace }}/scratch_tmp"

          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git wget \
            libeigen3-dev libhdf5-dev gfortran libquadmath0 libatomic1

          # Symlink HDF5 serial Ubuntu ke /usr/local/lib agar CMakeLists.txt langsung menemukannya
          sudo mkdir -p /usr/local/lib /usr/local/include
          if [ -f "/usr/lib/x86_64-linux-gnu/hdf5/serial/libhdf5.so" ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/hdf5/serial/libhdf5.so /usr/local/lib/libhdf5.so
            sudo ln -sf /usr/lib/x86_64-linux-gnu/hdf5/serial/libhdf5_cpp.so /usr/local/lib/libhdf5_cpp.so
          fi

          DEPS_CACHE="${{ github.workspace }}/mshqc_deps"
          if ( [ -f "$DEPS_CACHE/lib/libtblis.a" ] || [ -f "$DEPS_CACHE/lib64/libtblis.a" ] ) && [ -f "$DEPS_CACHE/include/tblis/tblis.h" ]; then
            echo "Restoring cached libcint & TBLIS to /usr/local..."
            sudo cp -r "$DEPS_CACHE"/* /usr/local/
            sudo ldconfig
          else
            rm -rf "$DEPS_CACHE"
            mkdir -p "$DEPS_CACHE"
            DEPS_BUILD="${{ github.workspace }}/deps_build"
            mkdir -p "$DEPS_BUILD"

            # 1. Build libcint v6.1.2 di SSD workspace (bukan /tmp)
            git clone --depth 1 -b v6.1.2 https://github.com/sunqm/libcint.git "$DEPS_BUILD/libcint"
            mkdir -p "$DEPS_BUILD/libcint/build" && cd "$DEPS_BUILD/libcint/build"
            export CFLAGS="-O3 -fPIC -mavx2 -mfma -mno-avx512f -funroll-loops -fno-math-errno -Wno-incompatible-pointer-types -std=gnu17"
            cmake -DCMAKE_INSTALL_PREFIX=/usr/local \
                  -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                  -DCMAKE_C_FLAGS="$CFLAGS" \
                  -DENABLE_EXAMPLE=0 -DENABLE_TEST=0 -DBUILD_SHARED_LIBS=OFF ..
            make -j$(nproc)
            sudo make install

            # 2. Build TBLIS v1.2.0 di SSD workspace (bukan /tmp)
            git clone --depth 1 -b v1.2.0 https://github.com/devinamatthews/tblis.git "$DEPS_BUILD/tblis"
            cd "$DEPS_BUILD/tblis" && git submodule update --init --recursive
            sed -i 's/SIGSTKSZ/8192/g' src/external/catch/catch.hpp
            sed -i '1i #include <limits>' src/external/marray/include/short_vector.hpp
            sed -i '1i #include <limits>' src/external/marray/include/range.hpp
            sed -i '1i #include <limits>' src/external/thread.h 2>/dev/null || true
            sed -i '1i #include <limits>' src/util/thread.h 2>/dev/null || true
            export CFLAGS="-O3 -fPIC -mno-avx512f -mno-avx512vl -mno-avx512dq -mno-avx512bw -mno-avx512cd -Wno-incompatible-pointer-types -std=gnu17"
            export CXXFLAGS="-O3 -fPIC -mno-avx512f -mno-avx512vl -mno-avx512dq -mno-avx512bw -mno-avx512cd -Wno-incompatible-pointer-types -std=gnu++17"
            ./configure --prefix=/usr/local --enable-static --disable-shared --with-pic --without-hwloc \
                        --enable-config=haswell,zen,core2,sandybridge,bulldozer,piledriver,excavator,reference \
                        CFLAGS="$CFLAGS" CXXFLAGS="$CXXFLAGS" LIBS="-latomic"
            make -j$(nproc)
            sudo make install

            sudo ldconfig
            cd "${{ github.workspace }}"
            rm -rf "$DEPS_BUILD"
            cp -r /usr/local/include /usr/local/lib* "$DEPS_CACHE"/
          fi

          test -f /usr/local/include/tblis/tblis.h
          test -f /usr/local/include/cint.h

      - name: Compile and Install mshqc from Current Commit (No PyPI Download)
        run: |
          mkdir -p ${{ github.workspace }}/scratch_tmp
          export TMPDIR="${{ github.workspace }}/scratch_tmp"

          python3 -m venv ${{ github.workspace }}/mshqc_venv
          ${{ github.workspace }}/mshqc_venv/bin/pip install --upgrade pip setuptools wheel nanobind cmake ninja \
            mkl mkl-devel mkl-include numpy scipy pytest

          export CMAKE_PREFIX_PATH="/usr/local"
          export TBLIS_DIR="/usr/local"
          export TBLIS_ROOT="/usr/local"
          export CINT_ROOT="/usr/local"
          export CPLUS_INCLUDE_PATH="/usr/local/include:${CPLUS_INCLUDE_PATH:-}"
          export CMAKE_BUILD_PARALLEL_LEVEL="4"
          ${{ github.workspace }}/mshqc_venv/bin/pip install . --no-build-isolation --no-cache-dir -v

          rm -rf ${{ github.workspace }}/scratch_tmp

      - name: Set up Micromamba & Install Psi4 (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: psi4_env
          create-args: >-
            -c conda-forge
            python=3.11
            psi4
            numpy
            scipy

      # ===================================================================
      # 1. PYTEST API VALIDATION
      # ===================================================================
      - name: Run Automated Pytest Validation Suite (tests/test_mshqc.py)
        run: |
          ${{ github.workspace }}/mshqc_venv/bin/pytest tests/test_mshqc.py -v -s

      # ===================================================================
      # 2. SUITE A: 5-SYSTEM HEAD-TO-HEAD BENCHMARK (test_mshqc2 vs benc)
      # ===================================================================
      - name: Run Standalone mshqc Benchmark (tests/test_mshqc2.py)
        run: |
          ${{ github.workspace }}/mshqc_venv/bin/python -u tests/test_mshqc2.py | tee mshqc_bench.txt

      - name: Run Standalone Psi4 Benchmark (tests/benc.py)
        shell: bash -el {0}
        run: |
          micromamba activate psi4_env
          python -u tests/benc.py | tee psi4_bench.txt

      - name: Compare 5-System Benchmark (tests/compare_mshqc_psi4.py)
        run: |
          ${{ github.workspace }}/mshqc_venv/bin/python tests/compare_mshqc_psi4.py mshqc_bench.txt psi4_bench.txt

      # ===================================================================
      # 3. SUITE B: BAB IV FULL BENCHMARK (105 RUNS + RAM + S2 + FD)
      # ===================================================================
      - name: Run Isolated mshqc Bab 4 Suite (tests/run_mshqc_bab4.py)
        run: |
          ${{ github.workspace }}/mshqc_venv/bin/python -u tests/run_mshqc_bab4.py --out mshqc_bab4_raw.json --log mshqc_bab4_runner.log

      - name: Run Isolated Psi4 Bab 4 Suite (tests/run_psi4_bab4.py)
        shell: bash -el {0}
        run: |
          micromamba activate psi4_env
          python -u tests/run_psi4_bab4.py --out psi4_bab4_raw.json --log psi4_bab4_runner.log

      - name: Compare & Generate Bab 4 Tables 1-6 (tests/compare_bab4.py)
        run: |
          ${{ github.workspace }}/mshqc_venv/bin/python -u tests/compare_bab4.py mshqc_bab4_raw.json psi4_bab4_raw.json
          if [ -f "comparison_bab4_summary.md" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat comparison_bab4_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # ===================================================================
      # 4. SUITE C: UNIVERSAL VALIDATION SUITE (ISOLATED RUNNERS)
      # ===================================================================
      - name: Run Isolated mshqc Universal Validation (tests/run_mshqc_universal.py)
        run: |
          ${{ github.workspace }}/mshqc_venv/bin/python -u tests/run_mshqc_universal.py --tier standard --basis cc-pVDZ --out mshqc_universal_raw.json | tee mshqc_universal_runner.log

      - name: Run Isolated Psi4 Universal Validation (tests/run_psi4_universal.py)
        shell: bash -el {0}
        run: |
          micromamba activate psi4_env
          python -u tests/run_psi4_universal.py --tier standard --basis cc-pVDZ --out psi4_universal_raw.json | tee psi4_universal_runner.log

      - name: Compare & Validate Universal Suite (tests/compare_universal.py)
        run: |
          ${{ github.workspace }}/mshqc_venv/bin/python -u tests/compare_universal.py mshqc_universal_raw.json psi4_universal_raw.json | tee test_universal_validation.txt
          if [ -f "comparison_universal_summary.md" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat comparison_universal_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # ===================================================================
      # 5. UPLOAD ARTIFACTS
      # ===================================================================
      - name: Upload Benchmark Logs & Comparison Tables as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mshqc-vs-psi4-benchmark-results
          path: |
            mshqc_bench.txt
            psi4_bench.txt
            comparison_summary.md
            mshqc_bab4_raw.json
            psi4_bab4_raw.json
            test_bab4_benchmark.txt
            bab4_extra_bench.txt
            comparison_bab4_summary.md
            mshqc_universal_raw.json
            psi4_universal_raw.json
            test_universal_validation.txt
            comparison_universal_summary.md