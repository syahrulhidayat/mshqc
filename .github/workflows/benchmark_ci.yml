name: Validation & Benchmark Suite (mshqc vs Psi4)

on:
  push:
    branches: [ "master", "main", "build-pypi" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  mshqc_tests_and_benchmark:
    name: Run mshqc Pytest & Benchmark (Prebuilt PyPI Wheel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Precompiled mshqc Wheel from PyPI (No Recompile)
        run: |
          python -m pip install --upgrade pip
          pip install mshqc pytest

      - name: Run Automated Pytest Suite (tests/test_mshqc.py)
        run: pytest tests/test_mshqc.py -v -s

      - name: Run Full 60-Run mshqc Benchmark (tests/test_mshqc2.py)
        run: python tests/test_mshqc2.py

  psi4_reference_benchmark:
    name: Run Psi4 Reference Benchmark (tests/benc.py)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Micromamba & Install Psi4 (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: psi4_env
          create-args: >-
            -c conda-forge
            python=3.11
            psi4
            numpy
            scipy

      - name: Run Full 60-Run Psi4 Benchmark (tests/benc.py)
        shell: bash -el {0}
        run: |
          micromamba activate psi4_env
          python tests/benc.py
