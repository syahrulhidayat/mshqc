name: Validation & Universal Benchmark Suite (mshqc vs Psi4)  run

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  universal_benchmark:
    name: Run Pytest & Benchmark Suite (mshqc Wheel vs Psi4)
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "4"
      TBLIS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HDF5_USE_FILE_LOCKING: "FALSE"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (for precompiled mshqc PyPI wheel)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Precompiled mshqc Wheel from PyPI (No C++ Recompile)
        run: |
          python3 -m venv /tmp/mshqc_venv
          /tmp/mshqc_venv/bin/pip install --upgrade pip
          /tmp/mshqc_venv/bin/pip uninstall -y mshqc || true
          /tmp/mshqc_venv/bin/pip install mshqc --no-cache-dir pytest

      # --- 1. RUN PYTEST UNTUK MSHQC ---
      - name: Run Automated Pytest Validation Suite (test_mshqc.py)
        run: |
          /tmp/mshqc_venv/bin/pytest tests/test_mshqc.py -v -s

      # --- 2. JALANKAN TEST MSHQC2 (RUNNER OUTPUT BENCHMARK) ---
      - name: Run mshqc Benchmark (test_mshqc2.py)
        run: |
          /tmp/mshqc_venv/bin/python tests/test_mshqc2.py > mshqc_out.txt
          cat mshqc_out.txt

      # --- 3. SET UP PSI4 ---
      - name: Set up Micromamba & Install Psi4 (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: psi4_env
          create-args: >-
            -c conda-forge
            python=3.11
            psi4
            numpy
            scipy

      # --- 4. JALANKAN BENC.PY PSI4 ---
      - name: Run Psi4 Benchmark (benc.py)
        shell: bash -el {0}
        run: |
          micromamba activate psi4_env
          python tests/benc.py > psi4_out.txt
          cat psi4_out.txt

      # --- 5. BANDINGKAN HASIL (TEST_MSHQC2 vs BENC.PY) ---
      - name: Compare Head-to-Head mshqc vs Psi4
        run: |
          /tmp/mshqc_venv/bin/python tests/compare_mshqc_psi4.py mshqc_out.txt psi4_out.txt || true

      # --- 6. UJI SKRIPSI BAB 4 ---
      - name: Run mshqc Bab 4 Benchmark
        run: |
          /tmp/mshqc_venv/bin/python tests/run_mshqc_bab4.py

      - name: Run Psi4 Bab 4 Benchmark
        shell: bash -el {0}
        run: |
          micromamba activate psi4_env
          python tests/run_psi4_bab4.py

      - name: Compare Bab 4 Results
        run: |
          /tmp/mshqc_venv/bin/python tests/compare_bab4.py || true

      # --- 7. RUNNER UNIVERSAL BAWAAN ---
      - name: Run mshqc Universal Benchmark
        run: |
          /tmp/mshqc_venv/bin/python tests/run_mshqc_universal.py

      - name: Run Psi4 Universal Reference Benchmark
        shell: bash -el {0}
        run: |
          micromamba activate psi4_env
          python tests/run_psi4_universal.py

      - name: Generate Universal Comparison Table
        run: |
          /tmp/mshqc_venv/bin/python tests/compare_universal.py || true

      # --- 8. UPLOAD SEMUA LOG ---
      - name: Upload Benchmark Logs & Comparison Table as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mshqc-vs-psi4-benchmark-results
          path: |
            *universal*.json
            *universal*.txt
            mshqc_out.txt
            psi4_out.txt
            *.md