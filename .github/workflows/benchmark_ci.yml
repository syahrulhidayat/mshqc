name: Validation & Benchmark Suite (mshqc vs Psi4)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  comprehensive_benchmark:
    name: Run Pytest & All Benchmarks (Bab4 & Universal)
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "4"
      TBLIS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HDF5_USE_FILE_LOCKING: "FALSE"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (for precompiled mshqc PyPI wheel)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Precompiled mshqc Wheel from PyPI (No C++ Recompile)
        run: |
          python3 -m venv /tmp/mshqc_venv
          /tmp/mshqc_venv/bin/pip install --upgrade pip
          /tmp/mshqc_venv/bin/pip uninstall -y mshqc || true
          /tmp/mshqc_venv/bin/pip install mshqc --no-cache-dir pytest

      - name: Run Automated Pytest Validation Suite (test_mshqc & test_mshqc2)
        run: |
          /tmp/mshqc_venv/bin/pytest tests/test_mshqc.py -v -s
          /tmp/mshqc_venv/bin/pytest tests/test_mshqc2.py -v -s || true
      
      - name: Set up Micromamba & Install Psi4 (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: psi4_env
          create-args: >-
            -c conda-forge
            python=3.11
            psi4
            numpy
            scipy

      # --- 1. UJI BAB 4 ---
      - name: Run mshqc Bab 4 Benchmark
        run: |
          /tmp/mshqc_venv/bin/python tests/run_mshqc_bab4.py

      - name: Run Psi4 Bab 4 Benchmark
        shell: bash -el {0}
        run: |
          micromamba activate psi4_env
          python tests/run_psi4_bab4.py

      - name: Compare Bab 4 Results
        run: |
          /tmp/mshqc_venv/bin/python tests/compare_bab4.py || true

      # --- 2. UJI UNIVERSAL ---
      - name: Run mshqc Universal Benchmark
        run: |
          /tmp/mshqc_venv/bin/python tests/run_mshqc_universal.py

      - name: Run Psi4 Universal Benchmark
        shell: bash -el {0}
        run: |
          micromamba activate psi4_env
          python tests/run_psi4_universal.py

      - name: Compare Universal Results
        run: |
          /tmp/mshqc_venv/bin/python tests/compare_universal.py || true
          
      - name: Compare General MSHQC vs Psi4
        run: |
          /tmp/mshqc_venv/bin/python tests/compare_mshqc_psi4.py || true

      # --- 3. UJI BENC.PY (Skrip Eksperimental) ---
      - name: Run benc.py (Standalone Benchmark)
        shell: bash -el {0}
        run: |
          micromamba activate psi4_env
          python tests/benc.py > benc_output.txt

      # --- 4. UPLOAD ARTIFACTS ---
      - name: Upload All Benchmark Logs & Comparison Tables
        uses: actions/upload-artifact@v4
        with:
          name: mshqc-vs-psi4-full-results
          path: |
            *.json
            *.txt
            *.md
            benc_output.txt