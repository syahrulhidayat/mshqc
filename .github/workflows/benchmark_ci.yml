name: Validation & Universal Benchmark Suite (mshqc vs Psi4)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  universal_benchmark:
    name: Run Pytest & Universal Benchmark (mshqc Wheel vs Psi4)
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "4"
      TBLIS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HDF5_USE_FILE_LOCKING: "FALSE"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (for precompiled mshqc PyPI wheel)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Precompiled mshqc Wheel from PyPI (No C++ Recompile)
        run: |
          python3 -m venv /tmp/mshqc_venv
          /tmp/mshqc_venv/bin/pip install --upgrade pip
          /tmp/mshqc_venv/bin/pip uninstall -y mshqc || true
          /tmp/mshqc_venv/bin/pip install mshqc --no-cache-dir pytest

      - name: Run Automated Pytest Validation Suite (tests/test_mshqc.py)
        run: |
          /tmp/mshqc_venv/bin/pytest tests/test_mshqc.py -v -s

      - name: Run mshqc Universal Benchmark
        run: |
          /tmp/mshqc_venv/bin/python tests/run_mshqc_universal.py

      - name: Set up Micromamba & Install Psi4 (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: psi4_env
          create-args: >-
            -c conda-forge
            python=3.11
            psi4
            numpy
            scipy

      - name: Run Psi4 Universal Reference Benchmark
        shell: bash -el {0}
        run: |
          micromamba activate psi4_env
          python tests/run_psi4_universal.py

      - name: Generate Universal Comparison Table
        run: |
          /tmp/mshqc_venv/bin/python tests/compare_universal.py

      - name: Upload Benchmark Logs & Comparison Table as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mshqc-vs-psi4-universal-results
          path: |
            *universal*.json
            *universal*.txt
            *.md