name: Validation & Universal Benchmark Suite (mshqc vs Psi4)

on:
  push:
    branches: ["build-pypi"]
  workflow_dispatch:

jobs:
  universal_benchmark:
    name: Run Pytest & Benchmark (${{ matrix.os }} | PyPI Wheel vs Psi4)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      OMP_NUM_THREADS: "4"
      TBLIS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HDF5_USE_FILE_LOCKING: "FALSE"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (for precompiled mshqc PyPI wheel)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Precompiled mshqc Wheel from PyPI (Linux, macOS & Windows)
        shell: bash -eo pipefail {0}
        run: |
          python -m venv mshqc_venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV_PY="$PWD/mshqc_venv/Scripts/python.exe"
            VENV_PYTEST="$PWD/mshqc_venv/Scripts/pytest.exe"
            echo "$PWD/mshqc_venv/Scripts" >> "$GITHUB_PATH"
            echo "$PWD/mshqc_venv/Lib/site-packages/Library/bin" >> "$GITHUB_PATH"
            echo "$PWD/mshqc_venv/Library/bin" >> "$GITHUB_PATH"
          else
            VENV_PY="$PWD/mshqc_venv/bin/python"
            VENV_PYTEST="$PWD/mshqc_venv/bin/pytest"
          fi

          echo "VENV_PY=$VENV_PY" >> "$GITHUB_ENV"
          echo "VENV_PYTEST=$VENV_PYTEST" >> "$GITHUB_ENV"

          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip uninstall -y mshqc || true
          "$VENV_PY" -m pip install mshqc --no-cache-dir pytest numpy scipy

          "$VENV_PY" -c "
          import os, shutil, pathlib, mshqc
          pkg_basis = pathlib.Path(mshqc.__file__).resolve().parent / 'basis'
          dst_basis = pathlib.Path('data/basis')
          dst_basis.mkdir(parents=True, exist_ok=True)
          if pkg_basis.is_dir():
              for gbs in pkg_basis.glob('*.gbs'):
                  shutil.copy2(gbs, dst_basis / gbs.name)
          print('Installed mshqc version:', getattr(mshqc, '__version__', 'unknown'))
          print('Bundled basis count:', len(list(dst_basis.glob('*.gbs'))))
          "

      - name: Run Automated Pytest Validation Suite (test_mshqc.py)
        shell: bash -eo pipefail {0}
        run: |
          "$VENV_PY" -m pytest tests/test_mshqc.py -v -s 2>&1 | tee 01_pytest_mshqc_log.txt

      - name: Run mshqc Benchmark (test_mshqc2.py)
        shell: bash -eo pipefail {0}
        run: |
          "$VENV_PY" -u tests/test_mshqc2.py 2>&1 | tee 02_mshqc_out.txt
          cp 02_mshqc_out.txt mshqc_out.txt

      - name: Set up Micromamba & Install Psi4 (conda-forge)
        if: runner.os != 'Windows'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: psi4_env
          create-args: >-
            -c conda-forge
            python=3.11
            psi4
            numpy
            scipy
            pip

      - name: Verify & Patch Psi4 LibXC Compatibility (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: |
          set -o pipefail
          micromamba activate psi4_env
          if ! python -c "import psi4" >/dev/null 2>&1; then
            echo "Mendeteksi ketidakcocokan fungsional LibXC pada Psi4, menerapkan patch proc_table.py..."
            python - << 'EOF'
          import pathlib, re, sys
          for p in pathlib.Path(sys.prefix).rglob("psi4/driver/procrouting/proc_table.py"):
              txt = p.read_text(encoding="utf-8")
              pattern = r"for key in functionals:\s+ssuper = build_superfunctional_from_dictionary\(functionals\[key\], 1, 1, True\)\[0\]"
              replacement = (
                  "for key in list(functionals.keys()):\n"
                  "    try:\n"
                  "        ssuper = build_superfunctional_from_dictionary(functionals[key], 1, 1, True)[0]\n"
                  "    except Exception:\n"
                  "        functionals.pop(key, None)\n"
                  "        continue"
              )
              new_txt, count = re.subn(pattern, replacement, txt)
              if count > 0:
                  p.write_text(new_txt, encoding="utf-8")
                  print(f"Berhasil melakukan patch pada: {p}")
          EOF
          fi
          python -c "import psi4; print('Psi4 berhasil dimuat, versi:', psi4.__version__)"

      - name: Run Psi4 Benchmark (benc.py)
        shell: bash -el {0}
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "Psi4 dilewati pada OS Windows." | tee 03_psi4_out.txt
            cp 03_psi4_out.txt psi4_out.txt
          else
            micromamba activate psi4_env
            python -u tests/benc.py 2>&1 | tee 03_psi4_out.txt
            cp 03_psi4_out.txt psi4_out.txt
          fi

      - name: Compare Head-to-Head mshqc vs Psi4
        shell: bash -eo pipefail {0}
        run: |
          "$VENV_PY" -u tests/compare_mshqc_psi4.py mshqc_out.txt psi4_out.txt 2>&1 | tee 04_compare_mshqc_psi4_log.txt

      - name: Run mshqc Bab 4 Benchmark
        shell: bash -eo pipefail {0}
        run: |
          "$VENV_PY" -u tests/run_mshqc_bab4.py 2>&1 | tee mshqc_bab4_stdout.txt
          if [ -f mshqc_bab4_test.txt ]; then
            cp mshqc_bab4_test.txt 05_mshqc_bab4_running_log.txt
          else
            cp mshqc_bab4_stdout.txt 05_mshqc_bab4_running_log.txt
          fi

      - name: Run Psi4 Bab 4 Benchmark
        shell: bash -el {0}
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "Psi4 Bab 4 dilewati pada OS Windows." | tee 06_psi4_bab4_running_log.txt
          else
            micromamba activate psi4_env
            python -u tests/run_psi4_bab4.py
            cp psi4_bab4_test.txt 06_psi4_bab4_running_log.txt
          fi

      - name: Compare Bab 4 Results
        shell: bash -eo pipefail {0}
        run: |
          "$VENV_PY" -u tests/compare_bab4.py 2>&1 | tee compare_bab4_stdout.txt
          if [ -f test_bab4_benchmark.txt ]; then
            cp test_bab4_benchmark.txt 07_compare_bab4_log.txt
          else
            cp compare_bab4_stdout.txt 07_compare_bab4_log.txt
          fi

      - name: Run mshqc Universal Benchmark
        shell: bash -eo pipefail {0}
        run: |
          "$VENV_PY" -u tests/run_mshqc_geom.py 2>&1 | tee 08_mshqc_universal_running_log.txt

      - name: Run Psi4 Universal Reference Benchmark
        shell: bash -el {0}
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "Psi4 Universal dilewati pada OS Windows." | tee 09_psi4_universal_running_log.txt
          else
            micromamba activate psi4_env
            python -u tests/run_psi4_geom.py 2>&1 | tee 09_psi4_universal_running_log.txt
          fi

      - name: Generate Universal Comparison Table
        shell: bash -eo pipefail {0}
        run: |
          "$VENV_PY" -u tests/compare_geom.py mshqc_geom_raw.json psi4_geom_raw.json 2>&1 | tee compare_univ_stdout.txt
          if [ -f test_geom_validation.txt ]; then
            cp test_geom_validation.txt 10_compare_universal_log.txt
          else
            cp compare_univ_stdout.txt 10_compare_universal_log.txt
          fi

      - name: Run Geometry Optimization & Vibrational Frequencies Benchmark (benchmark_geom_omp2_psi4.py)
        shell: bash -el {0}
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VENV_PY" -u tests/benchmark_geom_omp2_psi4.py 2>&1 | tee 11_benchmark_geom_omp2_psi4_log.txt
          else
            micromamba activate psi4_env
            python -m pip install --upgrade pip
            python -m pip install mshqc --no-cache-dir
            python -c "import mshqc, psi4"
            python -u tests/benchmark_geom_omp2_psi4.py 2>&1 | tee 11_benchmark_geom_omp2_psi4_log.txt
          fi

      - name: Run Universal Geometry Optimization Suite (test_universal_geom_opt.py)
        shell: bash -eo pipefail {0}
        run: |
          "$VENV_PY" -u tests/test_universal_geom_opt.py 2>&1 | tee 12_test_universal_geom_opt_log.txt

      - name: Upload All Running Logs (.txt only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mshqc-vs-psi4-benchmark-logs-${{ matrix.os }}
          path: |
            01_pytest_mshqc_log.txt
            02_mshqc_out.txt
            03_psi4_out.txt
            04_compare_mshqc_psi4_log.txt
            05_mshqc_bab4_running_log.txt
            06_psi4_bab4_running_log.txt
            07_compare_bab4_log.txt
            08_mshqc_universal_running_log.txt
            09_psi4_universal_running_log.txt
            10_compare_universal_log.txt
            11_benchmark_geom_omp2_psi4_log.txt
            12_test_universal_geom_opt_log.txt